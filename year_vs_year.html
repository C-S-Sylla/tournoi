<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Battle d'Années - Matchs</title>
    <style>
        :root { --primary: #6366f1; --bg: #0f172a; --card-bg: #1e293b; --text: #f8fafc; }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); margin: 0; text-align: center; }
        .header { padding: 20px; background: #1e293b; margin-bottom: 20px; position: relative; }
        
        .container { display: flex; justify-content: center; gap: 20px; padding: 20px; flex-wrap: wrap; }
        
        /* ADAPTATION MOBILE */
        .match-card { 
            background: var(--card-bg); 
            border-radius: 15px; 
            padding: 15px; 
            width: 100%; 
            max-width: 450px; 
            box-sizing: border-box;
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            border: 3px solid transparent; 
            transition: 0.3s; 
        }
        
        /* Couleurs pour Zone Gauche (Bleu) et Zone Droite (Rouge) */
        .match-card.year-left-card { border-color: rgba(59, 130, 246, 0.5); box-shadow: 0 0 15px rgba(59, 130, 246, 0.2); }
        .match-card.year-right-card { border-color: rgba(236, 72, 153, 0.5); box-shadow: 0 0 15px rgba(236, 72, 153, 0.2); }
        
        .video-box { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 10px; overflow: hidden; margin-bottom: 10px; }
        iframe, video { width: 100%; height: 100%; border: none; object-fit: cover; }
        
        button { background: var(--primary); color: white; border: none; padding: 15px; border-radius: 8px; cursor: pointer; font-size: 1.2rem; font-weight: bold; width: 100%; transition: 0.2s;}
        button:hover { opacity: 0.9; }
        
        .vs { font-size: 3rem; align-self: center; color: #ef4444; font-weight: bold; }
        .star-btn { background: #475569; padding: 8px; margin-bottom: 12px; font-size: 1rem; width: 100%; transition: 0.2s;}
        .star-btn.starred { background: #eab308; color: #0f172a; }
        
        .yt-link { color: #38bdf8; font-size: 0.85rem; padding: 6px; background: rgba(56,189,248,0.15); border-radius: 6px; text-decoration: none; display: inline-block; font-weight: bold; }
        .switch-btn { background: #1e293b; font-size: 0.8rem; padding: 8px; color: #94a3b8; border: 1px solid #475569; border-radius: 5px; cursor: pointer; margin-top: 5px; transition: 0.2s;}
        .switch-btn:hover { background: #334155; color: white;}
        .undo-btn { background: #ef4444; margin-top: 10px; display: none; padding: 10px 20px; font-size: 1rem; color: white; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; }

        @media (max-width: 768px) {
            .header { padding: 15px 10px; }
            .header h1 { font-size: 1.3rem; margin-top: 0; }
            .container { padding: 10px; gap: 10px; }
            .vs { font-size: 2rem; width: 100%; margin: 5px 0; }
            button { padding: 12px; font-size: 1.1rem; }
            .match-card h3 { font-size: 1.1rem; margin: 10px 0; }
        }
    </style>
</head>
<body>

<div class="header">
    <h1 id="round-name">
        <span id="score-left-name" style="color: #38bdf8;">Année A</span> 
        <span style="color: #ef4444;">VS</span> 
        <span id="score-right-name" style="color: #ec4899;">Année B</span>
    </h1>
    <p id="match-info" style="color: #94a3b8; font-weight: bold;">Duel 1 / X</p>
</div>

<div class="container" id="tournament-area">
    <div class="match-card year-left-card" id="card1">
        <div class="video-box" id="player1"></div>
        <h3 id="title1">Anime A</h3>
        <button id="star-0" class="star-btn" onclick="toggleStar(0)">☆ Marquer ?</button>
        <button onclick="vote(0)">CHOISIR</button>
    </div>
    
    <div class="vs">VS</div>
    
    <div class="match-card year-right-card" id="card2">
        <div class="video-box" id="player2"></div>
        <h3 id="title2">Anime B</h3>
        <button id="star-1" class="star-btn" onclick="toggleStar(1)">☆ Marquer ?</button>
        <button onclick="vote(1)">CHOISIR</button>
    </div>
    
    <button id="undo-btn" class="undo-btn" onclick="undo()">↩ Revenir au duel précédent</button>
</div>

<!-- Lecteurs de Préchargement Silencieux -->
<video id="preloader-1" preload="auto" style="display:none;"></video>
<video id="preloader-2" preload="auto" style="display:none;"></video>

<script>
    let currentList = [];
    let currentIndex = 0;
    const matchHistory = [];
    const historyStateStack = [];

    window.onload = () => {
        const stored = localStorage.getItem('tournamentParticipants');
        if (!stored) return window.location.href = 'index.html';
        
        // Récupération des vrais noms des années sélectionnées
        const yearNames = JSON.parse(localStorage.getItem('yearNames') || '{}');
        if (yearNames.left) document.getElementById('score-left-name').innerText = yearNames.left;
        if (yearNames.right) document.getElementById('score-right-name').innerText = yearNames.right;
        
        currentList = JSON.parse(stored);
        
        // Lance la résolution silencieuse d'AnimeThemes
        resolveAllAnimeThemesInBackground();
        
        updateDisplay();
    };

    async function resolveAllAnimeThemesInBackground() {
        console.log("🤖 [Background] Lancement de la résolution d'API pour toutes les musiques...");
        for (let i = 0; i < currentList.length; i++) {
            const entry = currentList[i];
            if (entry.at && !entry.resolvedUrl) {
                const url = await resolveAnimeThemesVideo(entry.at);
                if (url) {
                    entry.resolvedUrl = url;
                }
                await new Promise(resolve => setTimeout(resolve, 200));
            }
        }
        console.log("🤖 [Background] Toutes les musiques ont été résolues !");
    }

    async function resolveAnimeThemesVideo(atUrl) {
        try {
            const parts = atUrl.replace(/\/$/, "").split('/');
            const resp = await fetch(`https://api.animethemes.moe/anime/${parts[parts.length-2]}?include=animethemes.animethemeentries.videos`);
            const json = await resp.json();
            const themes = json.anime?.animethemes || [];
            const targetTheme = parts[parts.length-1].split('-')[0].toUpperCase();
            
            const match = themes.find(t => t.slug.toUpperCase() === targetTheme);
            if (match && match.animethemeentries) {
                let videos = [];
                match.animethemeentries.forEach(e => { if(e.videos) videos.push(...e.videos) });
                if (videos.length > 0) return videos.sort((a,b) => (a.resolution||1080) - (b.resolution||1080))[0].link;
            }
            
            for (const t of themes) {
                for (const e of t.animethemeentries || []) {
                    for (const v of e.videos || []) {
                        if ((v.link||"").toLowerCase().includes(parts[parts.length-1].toLowerCase())) return v.link;
                    }
                }
            }
        } catch(e) {}
        return null;
    }

    function updateDisplay() {
        if (currentIndex >= currentList.length) {
            return endCompte();
        }

        document.getElementById('undo-btn').style.display = historyStateStack.length > 0 ? 'inline-block' : 'none';
        document.getElementById('match-info').innerText = `Duel ${(currentIndex/2)+1} / ${currentList.length/2}`;

        const c1 = currentList[currentIndex];
        const c2 = currentList[currentIndex + 1];

        document.getElementById('title1').innerText = c1.title;
        document.getElementById('title2').innerText = c2.title;
        
        updateStarButtonState(0, c1.starred);
        updateStarButtonState(1, c2.starred);

        document.getElementById('player1').innerHTML = getPlayerHTML(c1, 0);
        document.getElementById('player2').innerHTML = getPlayerHTML(c2, 1);

        if (c1.at && !c1.resolvedUrl) loadAnimeThemesPlayer(c1, 1);
        if (c2.at && !c2.resolvedUrl) loadAnimeThemesPlayer(c2, 2);

        setTimeout(preloadNextMatches, 2500);
    }

    function getPlayerHTML(choice, index) {
        if (choice.at) {
            if (choice.resolvedUrl) {
                return `<video src="${choice.resolvedUrl}" controls preload="auto"></video>`;
            }
            return `<div id="video-loader-${index}" style="height:100%; display:flex; align-items:center; justify-content:center; color:#38bdf8; background:#000;">⏳ Résolution...</div>`;
        }
        
        // CORRIGÉ : Intégration YouTube propre
        return `
            <iframe src="https://www.youtube.com/embed/${choice.yt}?rel=0" allowfullscreen></iframe>
            <div style="margin-top: 8px;">
                <button class="switch-btn" onclick="switchPlayer(${index}, '${choice.yt}')">Lecteur alternatif si bloqué 🔁</button>
            </div>
        `;
    }

    // CORRIGÉ : Switch de lecteur alternatif
    function switchPlayer(i, ytId) {
        const iframe = document.querySelector(`#player${i + 1} iframe`);
        if (!iframe) return;
        if (iframe.src.includes('youtube')) {
            iframe.src = `https://yewtu.be/embed/${ytId}`;
        } else {
            iframe.src = `https://www.youtube.com/embed/${ytId}?rel=0`;
        }
    }

    async function loadAnimeThemesPlayer(choice, playerNum) {
        let url = await resolveAnimeThemesVideo(choice.at);
        if (url) {
            choice.resolvedUrl = url;
            const loader = document.getElementById(`video-loader-${playerNum - 1}`);
            if (loader && loader.parentElement) {
                loader.parentElement.innerHTML = `<video src="${url}" controls preload="auto"></video>`;
            }
        }
    }

    function force100PercentDownload(url, preloaderId, title) {
        const preloader = document.getElementById(preloaderId);
        if (!preloader) return;
        
        console.log(`🚀 [Forçage 100%] Aspiration lancée pour : ${title}`);
        
        preloader.src = url;
        preloader.muted = true;        
        preloader.playsInline = true;
        preloader.playbackRate = 16.0;

        preloader.play().then(() => {
            console.log(`🚀 [Forçage 100%] Téléchargement en cours...`);
        }).catch(e => console.warn(`Attente interaction utilisateur.`, e));

        preloader.onended = () => {
            console.log(`✅ [100%] TERMINÉ : ${title}`);
            preloader.pause();
        };
    }

    async function preloadNextMatches() {
        const listToUse = typeof currentList !== 'undefined' ? currentList : currentRound; 
        
        const nextIdx = currentIndex + 2;
        if (nextIdx >= listToUse.length) return;
        
        const c1 = listToUse[nextIdx];
        const c2 = listToUse[nextIdx + 1];

        const processPreload = async (choice, preloaderId) => {
            if (!choice || !choice.at || choice.isDownloaded) return;

            let url = choice.resolvedUrl;
            
            if (!url) {
                url = await resolveAnimeThemesVideo(choice.at);
                if (url) choice.resolvedUrl = url;
            }

            if (url) {
                choice.isDownloaded = true; 
                force100PercentDownload(url, preloaderId, choice.title);
            }
        };

        processPreload(c1, 'preloader-1');
        processPreload(c2, 'preloader-2');
    }

    function toggleStar(idx) {
        const entry = currentList[currentIndex + idx];
        entry.starred = !entry.starred;
        updateStarButtonState(idx, entry.starred);
    }
    
    function updateStarButtonState(idx, st) {
        const btn = document.getElementById(`star-${idx}`);
        btn.classList.toggle('starred', st); 
        btn.innerText = st ? "⭐ Marqué !" : "☆ Marquer ?";
    }

    function undo() {
        if (!historyStateStack.length) return;
        const prev = historyStateStack.pop();
        
        currentList = prev.currentList;
        currentIndex = prev.currentIndex;
        matchHistory.length = 0;
        matchHistory.push(...prev.matchHistory);
        
        updateDisplay();
    }

    function vote(idx) {
        historyStateStack.push({
            currentList: currentList.map(e => ({...e})), 
            currentIndex: currentIndex,
            matchHistory: matchHistory.map(m => ({...m}))
        });

        const winner = currentList[currentIndex + idx];
        matchHistory.push({ 
            p1: currentList[currentIndex], 
            p2: currentList[currentIndex+1], 
            winnerTitle: winner.title 
        });

        currentIndex += 2; 
        updateDisplay();
    }

    function endCompte() {
    document.getElementById('player1').innerHTML = ""; 
    document.getElementById('player2').innerHTML = "";
    
    const yearNames = JSON.parse(localStorage.getItem('yearNames') || '{}');

    localStorage.setItem('finalResults', JSON.stringify({ 
        matchHistory: matchHistory, 
        initialShuffled: currentList, 
        gameMode: "YEARS",
        yearNames: yearNames
    }));
    
    window.location.href = 'results.html'; // <-- NOM DU FICHIER CORRIGÉ
}
</script>
</body>
</html>
