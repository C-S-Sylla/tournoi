<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Battle d'Années - Matchs</title>

    <!-- PRECONNECT ANISONGDB / AMQ / CATBOX -->
    <link rel="dns-prefetch" href="https://naedist.animemusicquiz.com">
    <link rel="preconnect" href="https://naedist.animemusicquiz.com" crossorigin>
    <link rel="dns-prefetch" href="https://files.catbox.moe">
    <link rel="preconnect" href="https://files.catbox.moe" crossorigin>

    <style>
        :root { --primary: #6366f1; --bg: #0f172a; --card-bg: #1e293b; --text: #f8fafc; }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); margin: 0; text-align: center; }
        .header { padding: 20px; background: #1e293b; margin-bottom: 20px; position: relative; }
        
        .container { display: flex; justify-content: center; gap: 20px; padding: 20px; flex-wrap: wrap; }
        
        .match-card { 
            background: var(--card-bg); 
            border-radius: 15px; 
            padding: 15px; 
            width: 100%; 
            max-width: 450px; 
            box-sizing: border-box;
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            border: 3px solid transparent; 
            transition: 0.3s; 
        }
        
        .match-card.year-left-card { border-color: rgba(59, 130, 246, 0.5); box-shadow: 0 0 15px rgba(59, 130, 246, 0.2); }
        .match-card.year-right-card { border-color: rgba(72, 236, 75, 0.5); box-shadow: 0 0 15px rgba(72, 236, 94, 0.2); }
        
        .video-box { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 10px; overflow: hidden; margin-bottom: 10px; }
        iframe, video { width: 100%; height: 100%; border: none; object-fit: cover; }
        
        button { background: var(--primary); color: white; border: none; padding: 15px; border-radius: 8px; cursor: pointer; font-size: 1.2rem; font-weight: bold; width: 100%; transition: 0.2s;}
        button:hover { opacity: 0.9; }
        
        .vs { font-size: 3rem; align-self: center; color: #ef4444; font-weight: bold; }
        .star-btn { background: #475569; padding: 8px; margin-bottom: 12px; font-size: 1rem; width: 100%; transition: 0.2s;}
        .star-btn.starred { background: #eab308; color: #0f172a; }
        
        .switch-btn { background: #1e293b; font-size: 0.8rem; padding: 8px; color: #94a3b8; border: 1px solid #475569; border-radius: 5px; cursor: pointer; margin-top: 5px; transition: 0.2s;}
        .switch-btn:hover { background: #334155; color: white;}
        .undo-btn { background: #ef4444; margin-top: 10px; display: none; padding: 10px 20px; font-size: 1rem; color: white; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; }

        @media (max-width: 768px) {
            .header { padding: 15px 10px; }
            .header h1 { font-size: 1.3rem; margin-top: 0; }
            .container { padding: 10px; gap: 10px; }
            .vs { font-size: 2rem; width: 100%; margin: 5px 0; }
            button { padding: 12px; font-size: 1.1rem; }
            .match-card h3 { font-size: 1.1rem; margin: 10px 0; }
        }
    </style>
    <link rel="icon" type="image/png" href="favicon.png">

</head>
<body>

<div class="header">
    <h1 id="round-name">
        <span id="score-left-name" style="color: #38bdf8;">Année A</span> 
        <span style="color: #ef4444;">VS</span> 
        <span id="score-right-name" style="color: #48ec4d;">Année B</span>
    </h1>
    <p id="match-info" style="color: #94a3b8; font-weight: bold;">Duel 1 / X</p>
</div>

<div class="container" id="tournament-area">
    <div class="match-card year-left-card" id="card1">
        <div class="video-box" id="player1"></div>
        <h3 id="title1">Anime A</h3>
        <button id="star-0" class="star-btn" onclick="toggleStar(0)">☆ Marquer ?</button>
        <button onclick="vote(0)">CHOISIR</button>
    </div>
    
    <div class="vs">VS</div>
    
    <div class="match-card year-right-card" id="card2">
        <div class="video-box" id="player2"></div>
        <h3 id="title2">Anime B</h3>
        <button id="star-1" class="star-btn" onclick="toggleStar(1)">☆ Marquer ?</button>
        <button onclick="vote(1)">CHOISIR</button>
    </div>
</div>
<button id="undo-btn" class="undo-btn" onclick="undo()">↩ Revenir au duel précédent</button>

<!-- Lecteurs de Préchargement Silencieux -->
<video id="preloader-1" preload="auto" style="display:none;"></video>

<script>
    let currentList = [];
    let currentIndex = 0;
    const matchHistory = [];
    const historyStateStack = [];

    // --- 1. DÉMARRAGE ET PRÉCHARGEMENT ---
    window.onload = () => {
        const stored = localStorage.getItem('tournamentParticipants');
        if (!stored) return window.location.href = 'index.html';
        
        const yearNames = JSON.parse(localStorage.getItem('yearNames') || '{}');
        if (yearNames.left) document.getElementById('score-left-name').innerText = yearNames.left;
        if (yearNames.right) document.getElementById('score-right-name').innerText = yearNames.right;
        
        currentList = JSON.parse(stored);
        
        updateDisplay();
        startBackgroundPreloadAll();
    };

    // PRÉCHARGEMENT 100% BLOB EN TÂCHE DE FOND
    async function startBackgroundPreloadAll() {
        console.log("🚀 [AnisongDB] Téléchargement 100% Blob de tout le tableau...");

        for (let i = 0; i < currentList.length; i++) {
            const item = currentList[i];
            const videoUrl = item.as || item.at || item.link || item.url || item.resolvedUrl;

            // Si un lien vidéo existe et n'est pas encore téléchargé à 100%
            if (videoUrl && typeof videoUrl === 'string' && videoUrl.trim() !== "" && !item.blobUrl && !item.isDownloading) {
                item.isDownloading = true;

                try {
                    const cleanUrl = videoUrl.trim();
                    console.log(`📥 [Aspiration 100%] Téléchargement de : ${item.title}`);
                    
                    const response = await fetch(cleanUrl);
                    const blob = await response.blob();

                    // Crée l'URL Blob locale (Garantit une barre de chargement 100% pleine !)
                    item.blobUrl = URL.createObjectURL(blob);
                    item.isDownloaded = true;
                    console.log(`✅ [Barre 100% Pleine !] : ${item.title}`);

                    // HOT-SWAP EN DIRECT : Bascule la barre à 100% si le joueur regarde cette vidéo !
                    refreshActiveVideoPlayersIfBlobReady();
                } catch (e) {
                    console.warn(`Passage en flux direct pour ${item.title}`, e);
                } finally {
                    item.isDownloading = false;
                }
            }
        }
    }

    // HOT-SWAP EN DIRECT : Met la barre à 100% sans couper la musique
    function refreshActiveVideoPlayersIfBlobReady() {
        const checkAndSwap = (item, playerContainerId) => {
            if (!item || !item.blobUrl) return;
            const container = document.getElementById(playerContainerId);
            if (!container) return;

            const video = container.querySelector('video');
            // Si la vidéo tourne actuellement sur l'URL directe (pas encore en Blob)
            if (video && !video.src.startsWith('blob:')) {
                const currentTime = video.currentTime; // Retient la seconde exacte
                const isPaused = video.paused;

                // Bascule sur la version 100% locale
                video.src = item.blobUrl;
                video.currentTime = currentTime; // Reprend au même endroit
                if (!isPaused) {
                    video.play().catch(() => {});
                }
                console.log(`⚡ [Hot-Swap 100%] Barre de chargement passée à 100% en direct pour : ${item.title}`);
            }
        };

        if (currentList[currentIndex]) checkAndSwap(currentList[currentIndex], 'player1');
        if (currentList[currentIndex + 1]) checkAndSwap(currentList[currentIndex + 1], 'player2');
    }

    // --- 2. AFFICHAGE ET LECTEURS ---
    function updateDisplay() {
        if (currentIndex >= currentList.length) {
            return endCompte();
        }

        const undoBtn = document.getElementById('undo-btn');
        if (undoBtn) {
            undoBtn.style.display = historyStateStack.length > 0 ? 'inline-block' : 'none';
        }

        document.getElementById('match-info').innerText = `Duel ${(currentIndex/2)+1} / ${currentList.length/2}`;

        const c1 = currentList[currentIndex];
        const c2 = currentList[currentIndex + 1];

        document.getElementById('title1').innerText = c1.title;
        document.getElementById('title2').innerText = c2.title;
        
        updateStarButtonState(0, c1.starred);
        updateStarButtonState(1, c2.starred);

        document.getElementById('player1').innerHTML = getPlayerHTML(c1, 0);
        document.getElementById('player2').innerHTML = getPlayerHTML(c2, 1);
    }

    function getPlayerHTML(choice, index) {
        if (!choice) return `<div style="color:#ef4444; padding:20px;">⚠️ Élément vide</div>`;

        // 1. Utilise l'URL Blob (100% remplie) si disponible, sinon le lien direct (as, at, link)
        const videoSource = choice.blobUrl || choice.as || choice.at || choice.link || choice.url || choice.webm || choice.resolvedUrl;

        if (videoSource && typeof videoSource === 'string' && videoSource.trim() !== "") {
            return `<video src="${videoSource.trim()}" controls preload="auto" style="width:100%; height:100%; object-fit:cover; border-radius:10px; background:#000;"></video>`;
        }
        
        // 2. Si c'est un lien YouTube
        const ytId = choice.yt || choice.youtube || choice.youtubeId;

        if (ytId && typeof ytId === 'string' && ytId.trim() !== "") {
            return `
                <iframe src="https://www.youtube.com/embed/${ytId.trim()}?rel=0" allowfullscreen></iframe>
                <div style="margin-top: 8px;">
                    <button class="switch-btn" onclick="switchPlayer(${index}, '${ytId.trim()}')">Lecteur alternatif si bloqué 🔁</button>
                </div>
            `;
        }

        return `
            <div style="height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#ef4444; background:#000; padding:10px; text-align:center;">
                <span style="font-weight:bold; font-size:0.9rem;">⚠️ Lien manquant dans le JSON</span>
            </div>
        `;
    }

    function switchPlayer(i, ytId) {
        const iframe = document.querySelector(`#player${i + 1} iframe`);
        if (!iframe) return;
        if (iframe.src.includes('youtube.com')) {
            iframe.src = `https://yewtu.be/embed/${ytId}`;
        } else {
            iframe.src = `https://www.youtube.com/embed/${ytId}?rel=0`;
        }
    }

    // --- 3. BOUTONS ET NAVIGATION ---
    function toggleStar(idx) {
        const entry = currentList[currentIndex + idx];
        entry.starred = !entry.starred;
        updateStarButtonState(idx, entry.starred);
    }
    
    function updateStarButtonState(idx, st) {
        const btn = document.getElementById('star-' + idx);
        if (!btn) return;
        btn.classList.toggle('starred', st); 
        btn.innerText = st ? "⭐ Marqué !" : "☆ Marquer ?";
    }

    function undo() {
        if (!historyStateStack.length) return;
        const prev = historyStateStack.pop();
        
        currentList = prev.currentList;
        currentIndex = prev.currentIndex;
        matchHistory.length = 0;
        matchHistory.push(...prev.matchHistory);
        
        updateDisplay();
    }

    function vote(idx) {
        historyStateStack.push({
            currentList: currentList.map(e => ({...e})), 
            currentIndex: currentIndex,
            matchHistory: matchHistory.map(m => ({...m}))
        });

        const winner = currentList[currentIndex + idx];

        // Enregistre winnerSide: 0 (Gauche) ou winnerSide: 1 (Droite)
        matchHistory.push({ 
            p1: currentList[currentIndex], 
            p2: currentList[currentIndex+1], 
            winnerSide: idx,                 // <-- 0 = GAUCHE / 1 = DROITE
            winnerUid: winner.uid,
            winnerTitle: winner.title 
        });

        currentIndex += 2; 
        updateDisplay();
    }

    function endCompte() {
        document.getElementById('player1').innerHTML = ""; 
        document.getElementById('player2').innerHTML = "";
        
        const yearNames = JSON.parse(localStorage.getItem('yearNames') || '{}');

        localStorage.setItem('finalResults', JSON.stringify({ 
            matchHistory: matchHistory, 
            initialShuffled: currentList, 
            gameMode: "YEARS",
            yearNames: yearNames
        }));
        
        window.location.href = 'results.html';
    }
</script>
</body>
</html>
