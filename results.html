<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tournoi Anime OP/ED - Résultats Finaux</title>
    <!-- Inclusion de html2canvas pour l'export d'image du schéma -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { 
            --primary: #6366f1; 
            --bg: #0f172a; 
            --card-bg: #1e293b; 
            --text: #f8fafc; 
        }
        body { 
            font-family: sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            margin: 0; 
            text-align: center; 
            padding: 40px 20px;
        }
        .recap-section { 
            margin: 40px auto; 
            text-align: left; 
            max-width: 1100px; 
            width: 100%; 
        }
        h3 { 
            color: #38bdf8; 
            border-bottom: 2px solid #334155; 
            padding-bottom: 8px; 
            margin-bottom: 20px;
        }
        
        /* Composants standards */
        button { 
            background: var(--primary); 
            color: white; 
            border: none; 
            padding: 10px 20px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold; 
            transition: 0.2s;
        }
        button:hover { opacity: 0.9; }
        .match-card { 
            background: var(--card-bg); 
            border-radius: 15px; 
            padding: 15px; 
            width: 450px; 
            margin: 0 auto; 
        }
        .video-box { 
            width: 100%; 
            aspect-ratio: 16/9; 
            background: #000; 
            border-radius: 10px; 
            overflow: hidden; 
            margin-bottom: 10px; 
        }
        iframe, video { 
            width: 100%; 
            height: 100%; 
            border: none; 
            object-fit:cover; 
        }
        
        .yt-link { 
            display: inline-block; 
            color: #38bdf8; 
            text-decoration: none; 
            font-size: 0.85rem; 
            font-weight: bold; 
            background: rgba(56, 189, 248, 0.15); 
            padding: 6px 12px; 
            border-radius: 6px; 
            border: 1px solid rgba(56, 189, 248, 0.3); 
            transition: 0.2s; 
        }
        .yt-link:hover { background: rgba(56, 189, 248, 0.25); }
        .switch-btn { background: #1e293b; font-size: 0.8rem; padding: 5px 10px; color: #94a3b8; border: 1px solid #475569; border-radius: 5px; cursor: pointer; transition: 0.2s; }
        .switch-btn:hover { background: #334155; color: #f8fafc; }
        .fav-badge { background: rgba(234, 179, 8, 0.15); border: 1px solid rgba(234, 179, 8, 0.3); color: #fef08a; padding: 8px 16px; border-radius: 20px; font-weight: bold; display: inline-flex; align-items: center; gap: 5px; }

        /* ======== SCOREBOARD ======== */
        .scoreboard { display: flex; justify-content: center; gap: 30px; margin-bottom: 30px; font-size: 2rem; font-weight: bold; flex-wrap: wrap; }
        .score-box { background: var(--card-bg); padding: 25px 40px; border-radius: 15px; border: 2px solid #334155; box-shadow: 0 10px 20px rgba(0,0,0,0.5); min-width: 180px; }
        .winner-glow { border-color: #eab308; box-shadow: 0 0 20px rgba(234, 179, 8, 0.4); }

        /* ======== GRAPHIQUES ======== */
        .tally-wrapper {
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 25px;
            background: #090d16;
            border: 1px solid #334155;
            border-radius: 12px;
            width: 100%;
            box-sizing: border-box;
        }

        /* Mode Gender : 1 Colonne */
        .tally-single-column {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
        }

        /* ====================================================
   CONFINEMENT STRICT DU GRAPHISME DE FIN (TALLY)
   ==================================================== */

/* 1. CONTENEUR PARENT : Verrouille la largeur et ajoute un scroll propre si ça dépasse */
.tally-wrapper {
    width: 100% !important;
    max-width: 100% !important;
    box-sizing: border-box !important;
    overflow-x: auto !important; /* Active le défilement horizontal fluide */
    overflow-y: hidden !important;
    padding: 20px 10px !important;
    display: flex !important;
    gap: 15px !important;
    justify-content: flex-start !important;
    align-items: stretch !important;
    scroll-behavior: smooth;
}

/* 2. LES CARTES : Interdiction absolue de sortir du cadre */
.tally-card {
    flex: 0 0 auto !important; /* Empêche les cartes de s'étirer à l'infini */
    max-width: 100% !important;
    box-sizing: border-box !important;
    overflow: hidden !important; /* Coupe tout ce qui dépasse de la carte */
    word-break: break-word !important; /* Coupe les titres trop longs */
    border-radius: 12px;
}

/* 3. IMAGES / VIDÉOS DANS LES CARTES : S'adaptent toujours à la carte */
.tally-card img, 
.tally-card video, 
.tally-card iframe {
    max-width: 100% !important;
    height: auto !important;
    object-fit: cover;
}

/* 4. DESIGN BARRE DE DÉFILEMENT FLUIDE ET MODERNE (Scrollbar) */
.tally-wrapper::-webkit-scrollbar {
    height: 8px;
}
.tally-wrapper::-webkit-scrollbar-track {
    background: rgba(15, 23, 42, 0.6);
    border-radius: 10px;
}
.tally-wrapper::-webkit-scrollbar-thumb {
    background: var(--primary, #6366f1);
    border-radius: 10px;
}
.tally-wrapper::-webkit-scrollbar-thumb:hover {
    background: #4f46e5;
}

        /* Mode Years : 2 Colonnes */
        .tally-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 100%;
        }

        .tally-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #1e293b;
            border: 1px solid #334155;
            padding: 10px;
            border-radius: 10px;
            gap: 8px;
            box-sizing: border-box;
        }

        @media (max-width: 900px) {
            .tally-grid {
                grid-template-columns: 1fr;
            }
        }

        /* ======== MODE TOURNOI : BRACKET ======== */
        .bracket-scroll { width: 100%; max-height: 850px; overflow: hidden !important; border: 1px solid #334155; background: #090d16; padding: 30px 15px; border-radius: 12px; position: relative; cursor: grab; user-select: none; -ms-overflow-style: none; scrollbar-width: none; }
        .bracket-scroll::-webkit-scrollbar { display: none; }
        .bracket-scroll:active { cursor: grabbing; }
        .bracket-wrapper { display: flex; gap: 25px; align-items: center; justify-content: flex-start; width: max-content; position: relative; transform-origin: 0 0; }
        .bracket-column { display: flex; flex-direction: column; justify-content: space-around; height: 100%; width: 140px; position: relative; z-index: 2; }
        
        .bracket-node { width: 100%; height: 65px; background: #1e293b; border: 2px solid #475569; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; font-size: 0.7rem; overflow: hidden; transition: 0.2s; }
        .bracket-node img { width: 100%; height: 40px; object-fit: cover; border-bottom: 1px solid #334155; }
        .bracket-node .node-title { width: 100%; padding: 2px 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; box-sizing: border-box; background: rgba(15, 23, 42, 0.95); color: #f8fafc; }
        .node-starred { border-color: #eab308 !important; box-shadow: 0 0 10px rgba(234, 179, 8, 0.5); }
        .node-starred .node-title { color: #eab308 !important; font-weight: bold; }
        .bracket-node-tall { height: 105px !important; }
        .bracket-node-tall img { height: 80px !important; }
        .node-winner { border-color: #4ade80 !important; box-shadow: 0 0 15px rgba(74, 222, 128, 0.3) !important; }
        .node-winner .node-title { color: #4ade80 !important; font-weight: bold; }
        .node-loser { opacity: 0.4; }

        .download-btn { background: #10b981; }
        .download-btn:hover { background: #059669; }
        .fullscreen-btn { background: #3b82f6; }
        .fullscreen-btn:hover { background: #2563eb; }

        #bracket-section-container:fullscreen { background: #090d16; padding: 30px; width: 100vw; height: 100vh; display: flex; flex-direction: column; justify-content: center; }
        #bracket-section-container:fullscreen h3 { margin-top: 0; }
        #bracket-section-container:fullscreen .bracket-scroll { max-height: none !important; height: 100% !important; border: none; background: transparent; }

        .recap-table { width: 100%; border-collapse: collapse; background: var(--card-bg); border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.5); margin-bottom: 30px; }
        .recap-table th, .recap-table td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #334155; }
        .recap-table th { background-color: var(--primary); color: white; font-weight: bold; }
        .recap-table tr:hover { background-color: #334155; }
        .status-winner { color: #4ade80; font-weight: bold; }
        .status-finalist { color: #f43f5e; font-weight: bold; }
    </style>
</head>
<body>

<div id="results-container"></div>
<br><button onclick="window.location.href='index.html'" style="padding: 15px 40px; margin-top: 20px;">Retourner au Menu</button>

<script>
    // Variables globales
    let data = JSON.parse(localStorage.getItem('finalResults') || "{}");
    const { winner, matchHistory, initialShuffled, gameMode, yearNames } = data;

    let zoomScale = 1.0;
    let panX = 0;
    let panY = 0;
    let isPanning = false;
    let startX = 0;
    let startY = 0;

    // --- FONCTIONS ANIMETHEMES ---
    async function resolveAnimeThemesVideo(animethemesUrl) {
        try {
            const urlObj = new URL(animethemesUrl);
            const pathParts = urlObj.pathname.split('/').filter(p => p);
            const animeSlug = pathParts[1];
            const targetThemeSlug = pathParts[2].split('-')[0].toUpperCase();
            
            const response = await fetch(`https://api.animethemes.moe/anime/${animeSlug}?include=animethemes.animethemeentries.videos`);
            if (!response.ok) throw new Error("HTTP " + response.status);
            const json = await response.json();
            
            const themes = (json.anime && json.anime.animethemes) || [];
            const matchedTheme = themes.find(theme => theme.slug.toUpperCase() === targetThemeSlug);
            
            if (matchedTheme && matchedTheme.animethemeentries) {
                const allVideos = [];
                for (const entry of matchedTheme.animethemeentries) {
                    if (entry.videos) allVideos.push(...entry.videos);
                }
                if (allVideos.length > 0) {
                    allVideos.sort((a, b) => (a.resolution || 1080) - (b.resolution || 1080));
                    return allVideos[0].link;
                }
            }
            
            for (const theme of themes) {
                for (const entry of theme.animethemeentries || []) {
                    for (const video of entry.videos || []) {
                        if ((video.link||"").toLowerCase().includes(pathParts[2].toLowerCase()) || 
                            (video.basename||"").toLowerCase().includes(pathParts[2].toLowerCase())) {
                            return video.link;
                        }
                    }
                }
            }
        } catch (e) { console.error("Erreur API AnimeThemes :", e); }
        return null;
    }

    async function loadWinnerAnimeThemesPlayer(winnerEntry) {
        const loader = document.getElementById('video-loader-winner');
        if (!loader) return;

        const videoLink = await resolveAnimeThemesVideo(winnerEntry.at);

        if (videoLink) {
            const parent = loader.parentElement;
            if (parent) {
                parent.innerHTML = `
                    <video src="${videoLink}" controls autoplay style="width:100%; height:100%; object-fit:cover; border-radius:10px; background:#000;"></video>
                `;
            }
        } else {
            loader.innerHTML = `
                <div style="padding: 10px; color: #ef4444; font-size: 0.85rem; font-weight:bold; text-align:center;">
                    ⚠️ Résolution du Champion impossible.<br>
                    <a href="${winnerEntry.at}" target="_blank" style="display:inline-block; margin-top:8px; background:#ef4444; color:white; text-decoration:none; padding:6px 12px; border-radius:5px; font-size:0.8rem;">
                        Écouter sur AnimeThemes ↗
                    </a>
                </div>
            `;
        }
    }

    // --- INITIALISATION ---
    window.onload = () => {
        if (!matchHistory) return window.location.href = 'index.html';
        
        const starredEntries = (initialShuffled || []).filter(e => e.starred);
        let starredHtml = "";
        if (starredEntries.length > 0) {
            starredHtml = `
                <div class="recap-section">
                    <h3>⭐ VOS MORCEAUX MARQUÉS (Étoilés)</h3>
                    <div style="display: flex; flex-wrap: wrap; gap: 10px;">
                        ${starredEntries.map(e => `<div class="fav-badge">⭐ ${e.title}</div>`).join('')}
                    </div>
                </div>
            `;
        }

        if (gameMode === "GENDER" || gameMode === "YEARS") {
            renderTallyMode(starredHtml);
        } else {
            renderTournamentMode(starredHtml);
        }
    };

    // =========================================================
    // RENDU DES MODES DUEL (GENDER & YEARS)
    // =========================================================
    function renderTallyMode(starredHtml) {
    const isYearsMode = (gameMode === "YEARS");

    // RÉCUPÉRATION DES VRAIS NOMS (ex: "Année 2021" / "Année 2022")
    const storedYears = yearNames || JSON.parse(localStorage.getItem('yearNames') || '{}');
    const leftLabel = isYearsMode ? (storedYears.left || "Année 1") : "♀ ÉQUIPE FÉMININE";
    const rightLabel = isYearsMode ? (storedYears.right || "Année 2") : "♂ ÉQUIPE MASCULINE";

    const leftColor = isYearsMode ? "#00d2ff" : "#f472b6";
    const rightColor = isYearsMode ? "#ff0055" : "#60a5fa";

    let leftWins = 0, rightWins = 0;
    let graphRowsHtml = "";

    matchHistory.forEach(m => {
        let leftP, rightP;

        if (isYearsMode) {
            leftP = m.p1;
            rightP = m.p2;
        } else {
            const v1 = (m.p1.vocal || "").toLowerCase();
            if (v1 === "female" || v1 === "f") {
                leftP = m.p1; rightP = m.p2;
            } else {
                leftP = m.p2; rightP = m.p1;
            }
        }

        // CORRECTION ANTI-BUG : Détermination du vainqueur par CÔTÉ (winnerSide) ou par UID
        let leftWon = false;
        let rightWon = false;

        if (m.winnerSide !== undefined) {
            leftWon = (m.winnerSide === 0);
            rightWon = (m.winnerSide === 1);
        } else if (m.winnerUid) {
            leftWon = (m.winnerUid === leftP.uid);
            rightWon = (m.winnerUid === rightP.uid);
        } else {
            // Secours pour anciens fichiers (Le else if empêche que les deux gagnent !)
            if (m.winnerTitle === leftP.title) {
                leftWon = true;
            } else if (m.winnerTitle === rightP.title) {
                rightWon = true;
            }
        }

        if (leftWon) leftWins++;
        if (rightWon) rightWins++;

        // Miniature réparée
        const lThumb = leftP.yt ? `https://img.youtube.com/vi/${leftP.yt}/mqdefault.jpg` : (leftP.thumb ? `https://images.weserv.nl/?url=${encodeURIComponent(leftP.thumb)}` : "");
        const rThumb = rightP.yt ? `https://img.youtube.com/vi/${rightP.yt}/mqdefault.jpg` : (rightP.thumb ? `https://images.weserv.nl/?url=${encodeURIComponent(rightP.thumb)}` : "");

        if (isYearsMode) {
            // GRAPHIQUE A 2 COLONNES POUR LE MODE YEARS
            graphRowsHtml += `
                <div class="tally-card">
                    <div class="bracket-node bracket-node-tall ${leftWon ? 'node-winner' : 'node-loser'} ${leftP.starred ? 'node-starred' : ''}" style="flex: 1; margin:0;">
                        ${lThumb ? `<img src="${lThumb}" crossorigin="anonymous" alt="" />` : `<div style="background:#1e293b;width:100%;height:80px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;">🎵</div>`}
                        <div class="node-title">${leftP.starred ? '⭐ ' : ''}${leftP.title}</div>
                    </div>

                    <div style="font-size: 1.1rem; font-weight: 900; color: #ef4444; padding: 0 4px;">VS</div>

                    <div class="bracket-node bracket-node-tall ${rightWon ? 'node-winner' : 'node-loser'} ${rightP.starred ? 'node-starred' : ''}" style="flex: 1; margin:0;">
                        ${rThumb ? `<img src="${rThumb}" crossorigin="anonymous" alt="" />` : `<div style="background:#1e293b;width:100%;height:80px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;">🎵</div>`}
                        <div class="node-title">${rightP.starred ? '⭐ ' : ''}${rightP.title}</div>
                    </div>
                </div>
            `;
        } else {
            // GRAPHIQUE A 1 COLONNE UNIQUE POUR LE MODE GENDER
            graphRowsHtml += `
                <div style="display: flex; align-items: center; justify-content: space-between; width: 100%; border-bottom: 1px solid #1e293b; padding-bottom: 15px;">
                    <div class="bracket-node bracket-node-tall ${leftWon ? 'node-winner' : 'node-loser'} ${leftP.starred ? 'node-starred' : ''}" style="width: 42%; margin:0;">
                        ${lThumb ? `<img src="${lThumb}" crossorigin="anonymous" alt="" />` : `<div style="background:#1e293b;width:100%;height:80px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;">🎵</div>`}
                        <div class="node-title">${leftP.starred ? '⭐ ' : ''}${leftP.title}</div>
                    </div>

                    <div style="font-size: 1.5rem; font-weight: bold; color: #ef4444; width: 10%; text-align: center;">VS</div>

                    <div class="bracket-node bracket-node-tall ${rightWon ? 'node-winner' : 'node-loser'} ${rightP.starred ? 'node-starred' : ''}" style="width: 42%; margin:0;">
                        ${rThumb ? `<img src="${rThumb}" crossorigin="anonymous" alt="" />` : `<div style="background:#1e293b;width:100%;height:80px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;">🎵</div>`}
                        <div class="node-title">${rightP.starred ? '⭐ ' : ''}${rightP.title}</div>
                    </div>
                </div>
            `;
        }
    });

    const leftGlow = leftWins > rightWins ? 'winner-glow' : '';
    const rightGlow = rightWins > leftWins ? 'winner-glow' : '';
    
    let title = "";
    if (leftWins === rightWins) {
        title = "⚖️ ÉGALITÉ PARFAITE ⚖️";
    } else if (leftWins > rightWins) {
        title = isYearsMode ? `🏆 ${leftLabel.toUpperCase()} L'EMPORTE` : "🏆 LES FEMMES L'EMPORTENT";
    } else {
        title = isYearsMode ? `🏆 ${rightLabel.toUpperCase()} L'EMPORTE` : "🏆 LES HOMMES L'EMPORTENT";
    }

    const graphContainerHtml = isYearsMode 
        ? `<div class="tally-grid">${graphRowsHtml}</div>` 
        : `<div class="tally-single-column">${graphRowsHtml}</div>`;

    document.getElementById('results-container').innerHTML = `
        <h1 style="color:#f8fafc; font-size:2.5rem; margin-top:20px;">${title}</h1>
        
        <div class="scoreboard">
            <div class="score-box ${leftGlow}" style="color: ${leftColor};">${leftLabel}<br>${leftWins}</div>
            <div class="score-box ${rightGlow}" style="color: ${rightColor};">${rightLabel}<br>${rightWins}</div>
        </div>
        
        ${starredHtml}

        <div class="recap-section">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap:10px;">
                <h3>📊 GRAPHIQUE DES MATCHS</h3>
                <button class="download-btn" id="download-tally-btn" onclick="downloadTallyGraph()">📸 Télécharger le Graphique (PNG)</button>
            </div>
            
            <div class="tally-wrapper" id="tally-graph-wrapper">
                <div style="display: flex; justify-content: space-between; color: #94a3b8; font-weight: bold; font-size: 1.1rem; padding: 0 10px; margin-bottom: 10px;">
                    <span style="color: ${leftColor};">${leftLabel}</span>
                    <span style="color: ${rightColor};">${rightLabel}</span>
                </div>

                ${graphContainerHtml}
            </div>
        </div>
    `;
}

    function downloadTallyGraph() {
        const container = document.getElementById('tally-graph-wrapper');
        if (!container) return;
        
        const btn = document.getElementById('download-tally-btn');
        btn.innerText = "Génération... ⏳"; btn.disabled = true;

        html2canvas(container, { backgroundColor: "#090d16", useCORS: true, scale: 1.5 }).then(canvas => {
            const link = document.createElement('a'); 
            link.download = 'recap-matchs.png'; 
            link.href = canvas.toDataURL(); 
            link.click();
            btn.innerText = "📸 Télécharger le Graphique (PNG)"; btn.disabled = false;
        }).catch(err => {
            console.error(err); btn.innerText = "Erreur ❌"; btn.disabled = false;
        });
    }

    // ==========================================
    // RENDU DU MODE TOURNOI CLASSIQUE
    // ==========================================
    function renderTournamentMode(starredHtml) {
        let playerHTML = "";
        
        if (winner) {
            if (winner.at) {
                playerHTML = `
                    <div class="video-box-content" style="width:100%; height:100%;">
                        <div id="video-loader-winner" style="width:100%; height:100%; display:flex; align-items:center; justify-content:center; color:#38bdf8; background:#000; border-radius:10px;">
                            <span style="font-weight:bold;">Chargement de la vidéo du Champion... ⏳</span>
                        </div>
                    </div>
                    <div style="margin-top: 8px;">
                        <a class="yt-link" href="${winner.at}" target="_blank" style="background: rgba(16, 185, 129, 0.15); color: #10b981; border-color: rgba(16, 185, 129, 0.3);">
                            Ouvrir sur AnimeThemes ↗
                        </a>
                    </div>
                `;
                loadWinnerAnimeThemesPlayer(winner);
            } else {
                playerHTML = `
                    <iframe src="https://www.youtube-nocookie.com/embed/${winner.yt}?autoplay=1" allowfullscreen></iframe>
                    <div style="margin-top: 8px; display: flex; flex-direction: column; gap: 5px; align-items: center;">
                        <a class="yt-link" href="https://www.youtube.com/watch?v=${winner.yt}" target="_blank">
                            Ouvrir sur YouTube ↗
                        </a>
                        <button class="switch-btn" onclick="switchWinnerPlayer('${winner.yt}')">
                            <span id="switch-text-winner">Lecteur alternatif si bloqué 🔁</span>
                        </button>
                    </div>
                `;
            }
        }

        const tableHtml = generateTableHTML();

        document.getElementById('results-container').innerHTML = `
            <h1>🏆 VAINQUEUR FINAL 🏆</h1>
            <div class="match-card" style="width: 600px; max-width: 100%;">
                <div class="video-box" id="player-winner">${playerHTML}</div>
                <h2>${winner?.title || ""}</h2>
            </div>
            ${starredHtml}
            <div class="recap-section" id="bracket-section-container">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap:10px;">
                    <h3>🌿 GRAPH SCHÉMATIQUE DU TOURNOI</h3>
                    <div style="display: flex; gap: 10px;">
                        <button class="fullscreen-btn" onclick="toggleFullscreen()">🖥️ Plein écran</button>
                        <button class="download-btn" onclick="downloadBracket()">📸 Télécharger le Schéma (PNG)</button>
                    </div>
                </div>
                ${generateBracketVisual()}
            </div>
            ${tableHtml}
        `;

        setTimeout(() => {
            initZoomPan();
            autoFitBracket();
            drawBracketLines();
        }, 150);
    }

    function switchWinnerPlayer(ytId) {
        const iframe = document.querySelector(`#player-winner iframe`);
        const textSpan = document.getElementById(`switch-text-winner`);
        if (!iframe || !textSpan) return;
        if (iframe.src.includes('youtube')) {
            iframe.src = `https://yewtu.be/embed/${ytId}`;
            textSpan.innerText = "Retourner au lecteur YouTube 🔁";
        } else {
            iframe.src = `https://www.youtube-nocookie.com/embed/${ytId}?autoplay=1`;
            textSpan.innerText = "Lecteur alternatif si bloqué 🔁";
        }
    }

    function generateBracketVisual() {
        const tree = []; tree[0] = initialShuffled.map(e => ({ ...e }));
        const N = initialShuffled.length; const k = Math.log2(N);

        for (let lvl = 1; lvl <= k; lvl++) {
            tree[lvl] = [];
            for (let i = 0; i < tree[lvl - 1].length; i += 2) {
                const p1 = tree[lvl - 1][i], p2 = tree[lvl - 1][i + 1];
                if (!p2) { tree[lvl].push({ ...p1 }); continue; }
                const match = matchHistory.find(m => (m.p1.title === p1.title && m.p2.title === p2.title) || (m.p1.title === p2.title && m.p2.title === p1.title));
                tree[lvl].push(match ? { ...(initialShuffled.find(e => e.title === match.winnerTitle) || p1) } : { placeholder: true });
            }
        }
        
        const columns = {};
        for (let j = 0; j < k; j++) columns[`L-${j}`] = tree[j].slice(0, Math.pow(2, k - 1 - j));
        columns[`C-${k}`] = tree[k];
        for (let j = k - 1; j >= 0; j--) columns[`R-${j}`] = tree[j].slice(Math.pow(2, k - 1 - j), Math.pow(2, k - j));

        let html = `<div class="bracket-scroll"><div class="bracket-wrapper" style="height: ${(N/2)*75}px;"><svg id="bracket-lines" style="position: absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; stroke:#475569; stroke-width:2; fill:none;"></svg>`;
        
        const colOrder = [];
        for (let j = 0; j < k; j++) colOrder.push(`L-${j}`); colOrder.push(`C-${k}`); for (let j = k - 1; j >= 0; j--) colOrder.push(`R-${j}`);

        colOrder.forEach(colKey => {
            html += `<div class="bracket-column">`;
            const list = columns[colKey];
            const [side, lvlStr] = colKey.split('-');
            const lvl = parseInt(lvlStr);

            list.forEach((node, idx) => {
                const isPlaceholder = node.placeholder || (!node.yt && !node.at);
                
                let thumbUrl = "";
                if (node.yt) thumbUrl = `https://img.youtube.com/vi/${node.yt}/mqdefault.jpg`;
                else if (node.thumb) thumbUrl = `https://images.weserv.nl/?url=${encodeURIComponent(node.thumb)}`;
                
                const isStarred = node.starred;
                const isTall = lvl !== 0;

                html += `
                    <div class="bracket-node ${isStarred ? 'node-starred' : ''} ${isTall ? 'bracket-node-tall' : ''}" id="${side}-${lvl}-${idx}">
                        ${isPlaceholder ? `
                            <div style="background:#0f172a;width:100%;height:100%;"></div>
                        ` : `
                            ${thumbUrl ? `<img src="${thumbUrl}" crossorigin="anonymous" alt="" />` : `<div style="background:#1e293b;width:100%;height:40px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;border-bottom:1px solid #334155;">🎵</div>`}
                            <div class="node-title" title="${node.title}">${isStarred ? '⭐ ' : ''}${node.title}</div>
                        `}
                    </div>`;
            });
            html += `</div>`;
        });
        return html + `</div></div>`;
    }

    function drawBracketLines() {
        const svg = document.getElementById('bracket-lines');
        if (!svg) return;
        svg.innerHTML = '';
        const k = Math.log2(initialShuffled.length);
        for (let lvl = 0; lvl < k - 1; lvl++) {
            for (let i = 0; i < Math.pow(2, k - 1 - lvl); i++) {
                connectNodes(`L-${lvl}-${i}`, `L-${lvl+1}-${Math.floor(i/2)}`, svg);
                connectNodes(`R-${lvl}-${i}`, `R-${lvl+1}-${Math.floor(i/2)}`, svg);
            }
        }
        connectNodes(`L-${k-1}-0`, `C-${k}-0`, svg);
        connectNodes(`R-${k-1}-0`, `C-${k}-0`, svg);
    }

    function connectNodes(childId, parentId, svg) {
        const cEl = document.getElementById(childId), pEl = document.getElementById(parentId);
        if (!cEl || !pEl) return;
        const cCol = cEl.parentElement, pCol = pEl.parentElement;
        const cX = cCol.offsetLeft, cY = cCol.offsetTop + cEl.offsetTop, pX = pCol.offsetLeft, pY = pCol.offsetTop + pEl.offsetTop;
        const isL = childId.startsWith('L');
        const startX = isL ? cX + cEl.offsetWidth : cX, startY = cY + cEl.offsetHeight/2;
        const endX = isL ? pX : pX + pEl.offsetWidth, endY = pY + pEl.offsetHeight/2;
        const midX = (startX + endX) / 2;
        
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', `M ${startX} ${startY} L ${midX} ${startY} L ${midX} ${endY} L ${endX} ${endY}`);
        path.setAttribute('stroke', '#475569'); path.setAttribute('stroke-width', '2'); path.setAttribute('fill', 'none');
        svg.appendChild(path);
    }

    function generateTableHTML() {
        const rankWeight = { 
            "🏆 CHAMPION 🏆": 1, 
            "Finaliste (2ème)": 2, 
            "Top 4 (Demi-Finales)": 3, 
            "Top 8 (Quarts)": 4, 
            "Top 16 (8èmes)": 5, 
            "Top 32 (16èmes)": 6, 
            "Top 64 (32èmes)": 7 
        };
        
        const sortedEntries = [...initialShuffled].sort((a, b) => (rankWeight[a.result] || 9) - (rankWeight[b.result] || 9));

        let rows = sortedEntries.map(e => {
            let statusClass = "";
            if (e.result === "🏆 CHAMPION 🏆") statusClass = "status-winner";
            else if (e.result === "Finaliste (2ème)") statusClass = "status-finalist";
            
            // GESTION INTELLIGENTE : AnisongDB ("as") vs YouTube ("yt") vs AnimeThemes ("at")
            let directLink = "#";
            let linkText = "Lien ↗";
            let customStyle = "";

            if (e.as && typeof e.as === 'string' && e.as.trim() !== "") {
                directLink = e.as.trim();
                linkText = "Regarder ↗";
                customStyle = "background: rgba(16, 185, 129, 0.15); color: #10b981; border-color: rgba(16, 185, 129, 0.3);";
            } else if (e.yt && typeof e.yt === 'string' && e.yt.trim() !== "") {
                directLink = `https://www.youtube.com/watch?v=${e.yt.trim()}`;
                linkText = "YouTube ↗";
            } else if (e.at && typeof e.at === 'string' && e.at.trim() !== "") {
                directLink = e.at.trim();
                linkText = "Regarder ↗";
                customStyle = "background: rgba(16, 185, 129, 0.15); color: #10b981; border-color: rgba(16, 185, 129, 0.3);";
            }

            return `
                <tr>
                    <td style="text-align: center; font-size: 1.1rem;">${e.starred ? '⭐' : '☆'}</td>
                    <td style="font-weight: ${e.result === '🏆 CHAMPION 🏆' ? 'bold' : 'normal'}">${e.title}</td>
                    <td class="${statusClass}">${e.result}</td>
                    <td style="text-align: center;">
                        <a class="yt-link" href="${directLink}" target="_blank" style="padding: 4px 8px; font-size: 0.8rem; margin: 0; ${customStyle}">${linkText}</a>
                    </td>
                </tr>
            `;
        }).join('');

        return `
            <div class="recap-section">
                <h3>📊 CLASSEMENT GÉNÉRAL DES PARTICIPANTS</h3>
                <table class="recap-table">
                    <thead>
                        <tr>
                            <th style="width:80px; text-align:center;">Marqué</th>
                            <th>Titre de l'Anime / Musique</th>
                            <th>Résultat / Parcours</th>
                            <th style="width:140px; text-align:center;">Lien direct</th>
                        </tr>
                    </thead>
                    <tbody>${rows}</tbody>
                </table>
            </div>
        `;
    }

    function toggleFullscreen() {
        const el = document.getElementById('bracket-section-container');
        if (!el) return;
        if (!document.fullscreenElement) el.requestFullscreen().catch(e => alert(e.message));
        else document.exitFullscreen();
    }

    document.addEventListener('fullscreenchange', () => {
        const btn = document.querySelector('.fullscreen-btn');
        if (btn) {
            btn.innerText = document.fullscreenElement ? "❌ Quitter" : "🖥️ Plein écran";
            btn.style.background = document.fullscreenElement ? "#ef4444" : "#3b82f6";
        }
        setTimeout(() => { autoFitBracket(); drawBracketLines(); }, 150);
    });

    function constrainBounds() {
        const scrollEl = document.querySelector('.bracket-scroll'), wrapperEl = document.querySelector('.bracket-wrapper');
        if (!scrollEl || !wrapperEl) return;
        const W_view = scrollEl.clientWidth, H_view = scrollEl.clientHeight;
        const W_child = wrapperEl.offsetWidth, H_child = wrapperEl.offsetHeight;
        const marginX = W_view * 0.5, marginY = H_view * 0.5;
        panX = Math.max(marginX - (W_child * zoomScale), Math.min(panX, W_view - marginX));
        panY = Math.max(marginY - (H_child * zoomScale), Math.min(panY, H_view - marginY));
    }

    function applyZoomPan() {
        const wrapper = document.querySelector('.bracket-wrapper');
        if (!wrapper) return;
        constrainBounds();
        wrapper.style.transform = `translate(${panX}px, ${panY}px) scale(${zoomScale})`;
    }

    function autoFitBracket() {
        const scrollEl = document.querySelector('.bracket-scroll'), wrapperEl = document.querySelector('.bracket-wrapper');
        if (!scrollEl || !wrapperEl) return;
        const W_view = scrollEl.clientWidth, H_view = scrollEl.clientHeight;
        const W_child = wrapperEl.offsetWidth, H_child = wrapperEl.offsetHeight;
        zoomScale = Math.max(Math.min(W_view / W_child, H_view / H_child) * 0.95, 0.65);
        panX = (W_view - W_child * zoomScale) / 2; panY = (H_view - H_child * zoomScale) / 2;
        applyZoomPan();
    }

    function initZoomPan() {
        const scrollEl = document.querySelector('.bracket-scroll');
        if (!scrollEl) return;
        zoomScale = 1.0; panX = 0; panY = 0; applyZoomPan();

        scrollEl.addEventListener('mousedown', (e) => {
            if (e.button !== 0) return;
            isPanning = true; startX = e.clientX - panX; startY = e.clientY - panY;
            scrollEl.style.cursor = 'grabbing';
        });
        window.addEventListener('mousemove', (e) => { if (isPanning) { panX = e.clientX - startX; panY = e.clientY - startY; applyZoomPan(); }});
        window.addEventListener('mouseup', () => { if (isPanning) { isPanning = false; scrollEl.style.cursor = 'grab'; }});
        scrollEl.addEventListener('wheel', (e) => {
            e.preventDefault();
            if (e.ctrlKey) zoomScale = e.deltaY < 0 ? Math.min(zoomScale * 1.08, 3.0) : Math.max(zoomScale / 1.08, 0.15);
            else { panX -= e.deltaX; panY -= e.deltaY; }
            applyZoomPan();
        }, { passive: false });
    }

    function downloadBracket() {
        const container = document.querySelector('.bracket-wrapper');
        if (!container) return;
        const btn = document.querySelector('.download-btn');
        btn.innerText = "Génération... ⏳"; btn.disabled = true;
        const originalTransform = container.style.transform;
        container.style.transform = 'none';

        html2canvas(container, { backgroundColor: "#090d16", useCORS: true, scale: 1.5 }).then(canvas => {
            container.style.transform = originalTransform;
            const link = document.createElement('a'); link.download = 'recap-tournoi.png'; link.href = canvas.toDataURL(); link.click();
            btn.innerText = "📸 Télécharger le Schéma (PNG)"; btn.disabled = false;
        }).catch(err => {
            container.style.transform = originalTransform;
            console.error(err); btn.innerText = "Erreur ❌"; btn.disabled = false;
        });
    }

    window.addEventListener('resize', () => { autoFitBracket(); drawBracketLines(); });
</script>
