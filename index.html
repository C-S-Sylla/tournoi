<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Tournoi Anime OP/ED - Menu</title>
    <style>
        :root { 
            --c-purple-dark: #44077A; 
            --c-blue-light: #67B0E0; 
            --c-blue-purple: #3420E0; 
            --text: #f8fafc; 
            --accent-left: #00d2ff;
            --accent-right: #ff0055;
        }
        
        body { 
            font-family: sans-serif; 
            background: linear-gradient(135deg, #15022b, var(--c-purple-dark)); 
            color: var(--text); 
            margin: 0; 
            min-height: 100vh;
            overflow-x: hidden;
            overflow-y: auto; 
        }

        /* ====== DECORATION ÉTOILES FIXES ====== */
        .sparkle {
            position: fixed; 
            background: var(--c-blue-light);
            clip-path: polygon(50% 0%, 60% 40%, 100% 50%, 60% 60%, 50% 100%, 40% 60%, 0% 50%, 40% 40%);
            animation: twinkle 3s infinite alternate ease-in-out;
            z-index: 0;
            pointer-events: none; 
        }
        @keyframes twinkle {
            0% { transform: scale(0.8) rotate(0deg); opacity: 0.5; }
            100% { transform: scale(1.2) rotate(5deg); opacity: 1; }
        }

        .s1 { top: 10%; left: 15%; width: 50px; height: 50px; animation-delay: 0s; }
        .s2 { top: 25%; left: 8%; width: 40px; height: 40px; animation-delay: 1s; }
        .s3 { top: 50%; left: 18%; width: 60px; height: 60px; animation-delay: 0.5s; }
        .s4 { bottom: 15%; left: 10%; width: 70px; height: 70px; animation-delay: 2s; }
        .s5 { top: 5%; left: 40%; width: 50px; height: 50px; animation-delay: 1.5s; }
        .s6 { top: 5%; right: 25%; width: 60px; height: 60px; animation-delay: 0.2s; }
        .s7 { top: 20%; right: 10%; width: 80px; height: 80px; animation-delay: 1.2s; }
        .s8 { top: 55%; right: 30%; width: 45px; height: 45px; animation-delay: 0.8s; }
        .s9 { bottom: 15%; right: 12%; width: 70px; height: 70px; animation-delay: 1.8s; }

        /* ====== CONTENEUR PRINCIPAL ====== */
        .layout-wrapper {
            max-width: 800px;
            width: 90%;
            margin: 40px auto; 
            position: relative;
            z-index: 10;
        }

        /* ====== MAIN CARD (Le grand menu) ====== */
        .main-card {
            background: rgba(52, 32, 224, 0.25);
            border: 4px solid var(--c-blue-light);
            border-radius: 50px; 
            padding: 40px 50px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            margin-bottom: 30px;
            text-align: center;
        }

        h2 {
            margin-top: 0;
            color: var(--c-blue-light);
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .menu-group { margin-bottom: 25px; text-align: left; }
        .menu-group label { display: block; font-weight: bold; margin-bottom: 8px; color: var(--c-blue-light); font-size: 1.05rem; }
        
        .menu-select, .menu-input { 
            width: 100%; 
            padding: 15px; 
            border-radius: 12px; 
            background: rgba(255, 255, 255, 0.05); 
            color: white; 
            border: 2px solid var(--c-blue-light); 
            font-size: 1.1rem; 
            box-sizing: border-box; 
            transition: 0.2s; 
        }
        .menu-select:focus, .menu-input:focus { outline: none; background: rgba(255, 255, 255, 0.1); }
        .menu-select option { background: var(--c-purple-dark); color: white; }

        /* ====== RENDER MODE ANNÉE VS ANNÉE (ZONE GAUCHE / VS / ZONE DROITE) ====== */
        .vs-select-container {
            display: flex;
            align-items: center;
            gap: 15px;
            width: 100%;
        }
        .vs-select-box {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .vs-zone-label {
            font-size: 0.9rem;
            font-weight: bold;
            text-transform: uppercase;
        }
        .vs-zone-label.left { color: var(--accent-left); }
        .vs-zone-label.right { color: var(--accent-right); }

        .vs-circle {
            font-size: 1.3rem;
            font-weight: 900;
            font-style: italic;
            color: #fff;
            background: linear-gradient(135deg, var(--accent-left), var(--accent-right));
            border-radius: 50%;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.5);
            margin-top: 20px;
        }

        .radio-group { display: flex; gap: 12px; margin-top: 5px; }
        .radio-group input[type="radio"] { display: none; }
        .radio-label { 
            display: flex; align-items: center; cursor: pointer; 
            background: rgba(255, 255, 255, 0.05); 
            padding: 12px 15px; border-radius: 12px; border: 2px solid var(--c-blue-light); 
            transition: 0.2s; flex: 1; justify-content: center; font-weight: bold; color: var(--c-blue-light);
        }
        .radio-group input[type="radio"]:checked + .radio-label { 
            background: var(--c-blue-light); color: var(--c-purple-dark); 
        }

        #available-count { 
            margin-top: 20px; font-size: 1rem; color: #cbd5e1; line-height: 1.5; text-align: left;
            background: rgba(0,0,0,0.3); padding: 15px; border-radius: 12px; 
            border: 1px solid rgba(103, 176, 224, 0.5); white-space: pre-line; 
        }

        .launch-btn { 
            background: var(--c-blue-light); color: var(--c-purple-dark); border: none; 
            padding: 15px 30px; border-radius: 15px; cursor: pointer; font-size: 1.5rem; 
            font-weight: bold; width: 100%; transition: 0.3s; margin-top: 20px;
        }
        .launch-btn:hover { background: #8bd0fc; transform: scale(1.02); }

        /* ====== MODE CARDS (Les 3 boutons du bas) ====== */
        .mode-cards-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap; 
        }

        .mode-card {
            border: 4px solid var(--c-blue-light);
            border-radius: 30px;
            padding: 25px 15px;
            flex: 1;
            min-width: 150px;
            cursor: pointer;
            background: rgba(52, 32, 224, 0.1);
            color: var(--c-blue-light);
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2rem;
            text-align: center;
            backdrop-filter: blur(5px);
        }
        .mode-card:hover {
            background: rgba(103, 176, 224, 0.2);
            transform: translateY(-5px);
        }
        
        .mode-card.active {
            background: var(--c-blue-light);
            color: var(--c-purple-dark);
            box-shadow: 0 0 20px rgba(103, 176, 224, 0.6);
        }
    </style>
    <link rel="icon" type="image/png" href="favicon.png">

</head>
<body>

<!-- Décoration étoiles -->
<div class="sparkle s1"></div>
<div class="sparkle s2"></div>
<div class="sparkle s3"></div>
<div class="sparkle s4"></div>
<div class="sparkle s5"></div>
<div class="sparkle s6"></div>
<div class="sparkle s7"></div>
<div class="sparkle s8"></div>
<div class="sparkle s9"></div>

<div class="layout-wrapper">
    <!-- CARTE PRINCIPALE -->
    <div class="main-card">
        <h2>Menu de Configuration</h2>
        
        <!-- SÉLECTION SIMPLE (Mode Standard & Gender) -->
        <div class="menu-group" id="single-select-group">
            <label id="season-label">Liste des Saisons / Fichiers :</label>
            <select id="season-select" class="menu-select" onchange="onSeasonChange()"></select>
        </div>

        <!-- SÉLECTION DOUBLE VS (Mode Année VS Année) -->
        <div class="menu-group" id="year-vs-year-group" style="display: none;">
            <label>Confrontation d'Années (Choisis 2 fichiers "Année") :</label>
            <div class="vs-select-container">
                <div class="vs-select-box">
                    <span class="vs-zone-label left">Zone Gauche</span>
                    <select id="season-select-left" class="menu-select" onchange="onYearVsYearChange()"></select>
                </div>
                <div class="vs-circle">VS</div>
                <div class="vs-select-box">
                    <span class="vs-zone-label right">Zone Droite</span>
                    <select id="season-select-right" class="menu-select" onchange="onYearVsYearChange()"></select>
                </div>
            </div>
        </div>

        <div class="menu-group" id="json-upload-group" style="display: none;">
            <label>Uploader un fichier JSON local :</label>
            <input type="file" id="custom-json-file" class="menu-input" accept=".json" onchange="loadCustomJson(event)">
        </div>

        <div class="menu-group" id="category-group">
            <label>Catégorie :</label>
            <div class="radio-group">
                <input type="radio" id="cat-mix" name="category" value="MIX" checked onchange="updateCountLabel()"><label for="cat-mix" class="radio-label">Mix</label>
                <input type="radio" id="cat-op" name="category" value="OP" onchange="updateCountLabel()"><label for="cat-op" class="radio-label">Openings</label>
                <input type="radio" id="cat-ed" name="category" value="ED" onchange="updateCountLabel()"><label for="cat-ed" class="radio-label">Endings</label>
            </div>
        </div>

        <div class="menu-group">
            <label>Taille de la partie (Max) :</label>
            <select id="tournament-size-select" class="menu-select">
                <option value="64">64 Participants</option>
                <option value="32">32 Participants</option>
                <option value="16">16 Participants</option>
            </select>
        </div>

        <div id="available-count">Chargement...</div>
        
        <button class="launch-btn" onclick="initTournament()">LANCER LE JEU 🚀</button>
    </div>

    <!-- SÉLECTEUR DE MODES -->
    <div class="mode-cards-container">
        <div id="card-STANDARD" class="mode-card active" onclick="selectMode('STANDARD')">
            Tournoi Classique
        </div>
        <div id="card-GENDER" class="mode-card" onclick="selectMode('GENDER')">
            Male VS Female<br>Singer
        </div>
        <!-- BOUTON RENDU FONCTIONNEL -->
        <div id="card-YEARS" class="mode-card" onclick="selectMode('YEARS')">
            Année VS Année
        </div>
    </div>
</div>

<script>
    // --- LISTE GLOBALE DES SAISONS ---
    const presetSeasons = [
        // Saisons Classiques
        { id: "summer_2026_mix", name: "Été 2026", path: "data/summer-2026-mix.json" },
        { id: "automne_2019", name: "Automne 2019", path: "data/automne_2019.json" },
        { id: "summer_2019", name: "Été 2019", path: "data/summer_2019.json" },
        { id: "winter_2020", name: "Hiver 2020", path: "data/winter_2020.json" },
        { id: "winter_2022", name: "Hiver 2022", path: "data/winter_2022.json" },
        { id: "fall_2023", name: "Automne 2023", path: "data/fall_2023.json" },
        { id: "underrated_ed", name: "Underrated ED", path: "data/underrated ED.json" },
        
        // Fichiers "Année" pour le mode Année vs Année
        { id: "annee_2021", name: "Année 2021", path: "data/annee_2021.json" },
        { id: "annee_2022", name: "Année 2022", path: "data/annee_2022.json" },
        { id: "annee_2024", name: "Année 2024", path: "data/annee_2024.json" },
        { id: "annee_2014", name: "Année 2014", path: "data/annee_2014.json" },
        { id: "annee_2012", name: "Année 2012", path: "data/annee_2012.json" },


        
        // Fichiers exclusifs "Male VS Female"
        { id: "male_vs_female1", name: "Male vs Female Singer 1", path: "data/male_vs_female1.json" },
        { id: "male_vs_female2", name: "Male vs Female Singer 2", path: "data/male_vs_female2.json" },
        { id: "male_vs_female3", name: "Male vs Female Singer 3", path: "data/male_vs_female3.json" },
        { id: "male_vs_female4", name: "Male vs Female Singer 4", path: "data/male_vs_female4.json" }

    ];

    let selectedSeasonData = null;
    let leftSeasonData = null;
    let rightSeasonData = null;
    let currentMode = 'STANDARD';

    // AFFICHE / MASQUE L'OPTION 128 DYNAMIQUEMENT
    // AFFICHE ET SÉLECTIONNE AUTOMATIQUEMENT L'OPTION 128
    function updateTournamentSizeOptions() {
        const sizeSelect = document.getElementById('tournament-size-select');
        const catInput = document.querySelector('input[name="category"]:checked');
        const cat = catInput ? catInput.value : "MIX";

        // Condition : Uniquement en mode YEARS ET catégorie MIX
        const allow128 = (currentMode === 'YEARS' && cat === 'MIX');

        let opt128 = sizeSelect.querySelector('option[value="128"]');

        if (allow128) {
            if (!opt128) {
                opt128 = new Option("128 Participants (64 vs 64)", "128");
                sizeSelect.add(opt128, 0); // Ajoute 128 tout en haut
            }
            // SÉLECTION AUTOMATIQUE DE 128 !
            sizeSelect.value = "128"; 
        } else {
            if (opt128) {
                if (sizeSelect.value === "128") {
                    sizeSelect.value = "64"; // Repasse automatiquement à 64 si 128 n'est plus disponible
                }
                opt128.remove(); // Masque l'option 128
            }
        }
    }

    // --- GESTION DU MODE DE JEU ---
    function selectMode(mode) {
        currentMode = mode;
        
        // Activer la carte choisie
        document.getElementById('card-STANDARD').classList.remove('active');
        document.getElementById('card-GENDER').classList.remove('active');
        document.getElementById('card-YEARS').classList.remove('active');
        document.getElementById(`card-${mode}`).classList.add('active');

        const singleGroup = document.getElementById('single-select-group');
        const yearGroup = document.getElementById('year-vs-year-group');
        const categoryGroup = document.getElementById('category-group');

        // Affichage conditionnel de la catégorie
        categoryGroup.style.display = (mode === 'GENDER') ? 'none' : 'block';

        if (mode === 'YEARS') {
            // MODE ANNÉE VS ANNÉE : On bascule en mode split (Gauche / Droite)
            singleGroup.style.display = 'none';
            yearGroup.style.display = 'block';

            populateYearVsYearSelects();
            onYearVsYearChange();
        } else {
            // MODES STANDARD ET GENDER : Sélection simple
            singleGroup.style.display = 'block';
            yearGroup.style.display = 'none';

            const select = document.getElementById('season-select');
            select.innerHTML = '';
            
            const filteredSeasons = presetSeasons.filter(s => {
                if (mode === 'GENDER') return s.id.startsWith('male_vs_female');
                // En mode standard, on masque les fichiers de duel spécifique
                return !s.id.startsWith('male_vs_female');
            });

            filteredSeasons.forEach(season => {
                const opt = document.createElement('option');
                opt.value = season.id;
                opt.innerText = season.name;
                select.appendChild(opt);
            });

            select.add(new Option("Uploader votre fichier JSON", "custom"));
            onSeasonChange();
        }
                updateTournamentSizeOptions();

    }

    // Helper : Vérifie si un fichier commence par "année" ou "annee"
    function isYearFile(season) {
        const idLower = season.id.toLowerCase();
        const nameLower = season.name.toLowerCase();
        return idLower.startsWith('annee') || idLower.startsWith('année') || 
               nameLower.startsWith('annee') || nameLower.startsWith('année');
    }

    // Remplissage des 2 selecteurs (Zone Gauche & Zone Droite) uniquement avec les JSON "année"
    function populateYearVsYearSelects() {
        const leftSelect = document.getElementById('season-select-left');
        const rightSelect = document.getElementById('season-select-right');

        leftSelect.innerHTML = '';
        rightSelect.innerHTML = '';

        // FILTRE STRICT : Uniquement les fichiers commençant par "année" / "annee"
        const yearFiles = presetSeasons.filter(s => isYearFile(s));

        yearFiles.forEach((season, index) => {
            const optLeft = new Option(season.name, season.id);
            const optRight = new Option(season.name, season.id);
            
            leftSelect.add(optLeft);
            rightSelect.add(optRight);
        });

        // Par défaut, sélectionner la 1ère année à gauche et la 2ème à droite si disponible
        if (yearFiles.length > 1) {
            rightSelect.selectedIndex = 1;
        }
    }

    function normalizeEntry(e, index) {
        let title = e.title || e.name || e.song || e.label || `Entrée ${index + 1}`;
        const yt = e.yt || e.youtube || e.youtubeId || e.videoId || e.id || e.url || "";
        const as = e.as || "";
        const at = e.at || ""; 
        const thumb = e.thumb || ""; 
        const vocal = (e.vocal || e.gender || "").toLowerCase();

        // IDENTIFIANT UNIQUE INDÉPENDANT DU NOM :
        const uid = e.uid || `uid_${index}_${Math.random().toString(36).substr(2, 9)}`;

        const rawType = e.type || e.category || e.kind || "";
        const titleText = `${title} ${rawType}`.toUpperCase();

        let type = "OP";
        if (rawType === "ED" || rawType === "ending" || rawType === "Ending" || titleText.includes("(ED)") || titleText.includes("ENDING")) {
            type = "ED";
        } else if (rawType === "MIX" || rawType === "mix") {
            type = "MIX";
        }

        if (type === "OP" && !title.toUpperCase().includes("(OP)")) title = `${title} (OP)`;
        else if (type === "ED" && !title.toUpperCase().includes("(ED)")) title = `${title} (ED)`;

        return { uid, title, yt, as, at, thumb, type, vocal, starred: false, result: "" };
    }

    function normalizeSeasonData(raw, fallbackName) {
        if (Array.isArray(raw)) return { seasonName: fallbackName || "Saison importée", entries: raw };
        if (raw && typeof raw === "object") {
            const possibleArrays = [raw.entries, raw.items, raw.data, raw.tracks, raw.songs, raw.musics].filter(Array.isArray);
            const source = possibleArrays[0] || [];
            return { seasonName: raw.seasonName || raw.name || raw.title || fallbackName || "Saison importée", entries: source };
        }
        return { seasonName: fallbackName || "Saison importée", entries: [] };
    }

    function parseEntries(entries) {
        if (!Array.isArray(entries)) return [];
        return entries.map((entry, index) => normalizeEntry(entry, index));
    }

    function getSelectedEntries() {
        if (selectedSeasonData && Array.isArray(selectedSeasonData.entries)) {
            return parseEntries(selectedSeasonData.entries);
        }
        return [];
    }

    function updateCountLabel() {
        // MET A JOUR LA TAILLE MAX (128) SI CATEGORIE CHANGE
        updateTournamentSizeOptions();

        if (currentMode === 'YEARS') {
            if (!leftSeasonData || !rightSeasonData) return;
            const leftEntries = parseEntries(leftSeasonData.entries);
            const rightEntries = parseEntries(rightSeasonData.entries);

            document.getElementById('available-count').innerText =
                `⚔️ CONFRONTATION D'ANNÉES ⚔️\n` +
                `Zone Gauche (${leftSeasonData.seasonName}) : ${leftEntries.length} morceaux\n` +
                `Zone Droite (${rightSeasonData.seasonName}) : ${rightEntries.length} morceaux`;
            return;
        }

        if (!selectedSeasonData) return;
        const parsed = getSelectedEntries();
        const total = parsed.length;
        const ops = parsed.filter(e => e.type === "OP").length;
        const eds = parsed.filter(e => e.type === "ED").length;
        
        const males = parsed.filter(e => e.vocal === "male" || e.vocal === "m").length;
        const females = parsed.filter(e => e.vocal === "female" || e.vocal === "f").length;

        const name = selectedSeasonData.seasonName || "Aucune saison";

        document.getElementById('available-count').innerText =
            `Saison chargée : ${name}\n` +
            `Total disponible : ${total} morceaux (OP: ${ops} | ED: ${eds})\n` +
            `Tags trouvés : ${males} ♂ Hommes | ${females} ♀ Femmes`;
    }

    async function loadPresetSeason(id) {
        const season = presetSeasons.find(s => s.id === id);
        if (!season) return null;
        try { 
            const response = await fetch(season.path);
            if (!response.ok) throw new Error("Erreur HTTP");
            const data = await response.json();
            return normalizeSeasonData(data, season.name);
        } catch(e) {
            console.warn("Erreur de chargement pour", id, e);
            return null;
        }
    }

    async function onSeasonChange() {
        const select = document.getElementById('season-select');
        document.getElementById('json-upload-group').style.display = select.value === "custom" ? "block" : "none";
        if (select.value !== "custom") {
            selectedSeasonData = await loadPresetSeason(select.value);
            updateCountLabel();
        }
    }

    async function onYearVsYearChange() {
        const leftId = document.getElementById('season-select-left').value;
        const rightId = document.getElementById('season-select-right').value;

        leftSeasonData = await loadPresetSeason(leftId);
        rightSeasonData = await loadPresetSeason(rightId);

        updateCountLabel();
    }

    function loadCustomJson(e) {
        const reader = new FileReader();
        reader.onload = ev => { 
            selectedSeasonData = normalizeSeasonData(JSON.parse(ev.target.result), "Saison importée"); 
            updateCountLabel(); 
        };
        reader.readAsText(e.target.files[0]);
    }

    function initTournament() {
        let finalEntries = [];
        let size = parseInt(document.getElementById('tournament-size-select').value);

        if (currentMode === "YEARS") {
            const leftSelect = document.getElementById('season-select-left');
            const rightSelect = document.getElementById('season-select-right');

            if (!leftSelect.value || !rightSelect.value) return alert("Sélectionnez deux années valides.");

            const leftName = leftSelect.options[leftSelect.selectedIndex].text;
            const rightName = rightSelect.options[rightSelect.selectedIndex].text;

            const yearNames = { left: leftName, right: rightName };
            localStorage.setItem('yearNames', JSON.stringify(yearNames));

            const cat = document.querySelector('input[name="category"]:checked').value;
            let leftEntries = parseEntries(leftSeasonData ? leftSeasonData.entries : []);
            let rightEntries = parseEntries(rightSeasonData ? rightSeasonData.entries : []);

            if (cat !== "MIX") {
                leftEntries = leftEntries.filter(e => e.type === cat);
                rightEntries = rightEntries.filter(e => e.type === cat);
            }

            leftEntries.sort(() => Math.random() - 0.5);
            rightEntries.sort(() => Math.random() - 0.5);

            let pairs = Math.min(leftEntries.length, rightEntries.length, size / 2);
            if (pairs === 0) return alert("Pas assez de morceaux dans les deux années sélectionnées !");

            // TIRAGE 100% PUR ET NATUREL
            for (let i = 0; i < pairs; i++) {
                finalEntries.push(leftEntries[i], rightEntries[i]);
            }
        } else if (currentMode === "GENDER") {
            let parsed = getSelectedEntries();
            const males = parsed.filter(e => e.vocal === "male" || e.vocal === "m").sort(() => Math.random() - 0.5);
            const females = parsed.filter(e => e.vocal === "female" || e.vocal === "f").sort(() => Math.random() - 0.5);
            
            let pairs = Math.min(males.length, females.length, size / 2);
            if (pairs === 0) return alert("Pas assez de musiques taguées vocal: male et female dans ce fichier !");
            
            for (let i = 0; i < pairs; i++) {
                if (Math.random() > 0.5) finalEntries.push(males[i], females[i]);
                else finalEntries.push(females[i], males[i]);
            }
        } else {
            let parsed = getSelectedEntries();
            const cat = document.querySelector('input[name="category"]:checked').value;
            if (cat !== "MIX") parsed = parsed.filter(e => e.type === cat);

            if (parsed.length === 0) return alert("Aucun morceau ne correspond aux critères choisis !");

            // DETECTE SI C'EST UNE SEED IMPORTÉE :
            if (selectedSeasonData && selectedSeasonData.isPreShuffledSeed) {
                console.log("🔒 [Seed Détectée] Verrouillage du mélange ! Ordre exact conservé.");
                finalEntries = parsed;
                size = finalEntries.length;

                if (selectedSeasonData.gameMode) currentMode = selectedSeasonData.gameMode;
                if (selectedSeasonData.yearNames) localStorage.setItem('yearNames', JSON.stringify(selectedSeasonData.yearNames));
            } else {
                // Saison classique : RESPECTE LE CHOIX DE TAILLE DU JOUEUR (16, 32, 64)
                parsed.sort(() => Math.random() - 0.5);

                const userChosenSize = parseInt(document.getElementById('tournament-size-select').value);
                const powers = [64, 32, 16, 8, 4, 2];

                // Trouve la taille maximale possible selon le nombre de musiques disponibles
                const maxPossiblePower = powers.find(p => p <= parsed.length) || 2;

                // Prend le MINIMUM entre le choix du joueur et le max disponible
                size = Math.min(userChosenSize, maxPossiblePower);

                // Découpe exactement à la taille demandée !
                finalEntries = parsed.slice(0, size);
            }
        }

        finalEntries.forEach(entry => { entry.starred = false; entry.result = `Top ${size}`; });

        localStorage.setItem('tournamentParticipants', JSON.stringify(finalEntries));
        localStorage.setItem('gameMode', currentMode);
        
        if (currentMode === "GENDER") window.location.href = 'gender_match.html';
        else if (currentMode === "YEARS") window.location.href = 'year_vs_year.html';
        else window.location.href = 'tournament.html';
    }

    // Initialisation au démarrage
    selectMode('STANDARD');
</script>
</body>
</html>
