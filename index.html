<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Tournoi Anime OP/ED - Menu de Configuration</title>
    <style>
        :root { 
            --primary: #6366f1; 
            --bg: #0f172a; 
            --card-bg: #1e293b; 
            --text: #f8fafc; 
        }
        body { 
            font-family: sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            margin: 0; 
            text-align: center; 
            padding: 20px;
        }
        
        #menu-screen {
            max-width: 600px;
            margin: 50px auto;
            background: var(--card-bg);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid #334155;
        }
        .menu-group {
            margin-bottom: 25px;
            text-align: left;
        }
        .menu-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #38bdf8;
            font-size: 1.05rem;
        }
        .menu-select, .menu-input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            background: #0f172a;
            color: white;
            border: 1px solid #334155;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
            transition: 0.2s;
        }
        .menu-select:focus, .menu-input:focus {
            border-color: var(--primary);
        }
        .radio-group {
            display: flex;
            gap: 12px;
            margin-top: 5px;
        }
        .radio-group input[type="radio"] {
            display: none;
        }
        .radio-label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            background: #0f172a;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid #334155;
            transition: 0.2s;
            flex: 1;
            justify-content: center;
            font-weight: bold;
            user-select: none;
        }
        .radio-label:hover {
            border-color: var(--primary);
        }
        .radio-group input[type="radio"]:checked + .radio-label {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }
        
        button { 
            background: var(--primary); 
            color: white; 
            border: none; 
            padding: 15px 30px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 1.2rem; 
            font-weight: bold; 
            width: 100%; 
            transition: 0.2s;
        }
        button:hover {
            opacity: 0.9;
        }

        #available-count {
            margin-top: 20px; 
            font-size: 0.9rem; 
            color: #94a3b8; 
            line-height: 1.5; 
            background: #0f172a; 
            padding: 15px; 
            border-radius: 8px; 
            border: 1px solid #334155; 
            white-space: pre-line;
        }
    </style>
</head>
<body>

<div id="menu-screen">
    <h2 style="color: #38bdf8; margin-top: 0;">🎵 MENU DE CONFIGURATION 🎵</h2>
    <p style="color: #94a3b8; font-size: 0.9rem;">Préparez vos paramètres avant de démarrer la compétition.</p>
    <br>

    <div class="menu-group">
        <label for="season-select">1. Sélectionner la Saison :</label>
        <select id="season-select" class="menu-select" onchange="onSeasonChange()"></select>
    </div>

    <div class="menu-group" id="json-upload-group" style="display: none;">
        <label for="custom-json-file">Charger le fichier JSON personnalisé :</label>
        <input type="file" id="custom-json-file" class="menu-input" accept=".json" onchange="loadCustomJson(event)">
    </div>

    <div class="menu-group">
        <label>2. Catégorie des musiques :</label>
        <div class="radio-group">
            <input type="radio" id="cat-mix" name="category" value="MIX" checked onchange="updateCountLabel()">
            <label for="cat-mix" class="radio-label">Mix (OP + ED)</label>

            <input type="radio" id="cat-op" name="category" value="OP" onchange="updateCountLabel()">
            <label for="cat-op" class="radio-label">Openings</label>

            <input type="radio" id="cat-ed" name="category" value="ED" onchange="updateCountLabel()">
            <label for="cat-ed" class="radio-label">Endings</label>
        </div>
    </div>

    <!-- NOUVEAU : Sélection du mode de jeu -->
    <div class="menu-group">
        <label>3. Mode de Jeu :</label>
        <div class="radio-group">
            <input type="radio" id="mode-standard" name="gamemode" value="STANDARD" checked>
            <label for="mode-standard" class="radio-label">Tournoi Classique</label>

            <input type="radio" id="mode-gender" name="gamemode" value="GENDER">
            <label for="mode-gender" class="radio-label">male vs female singer</label>
        </div>
    </div>

    <div class="menu-group">
        <label for="tournament-size-select">4. Taille du Tournoi :</label>
        <select id="tournament-size-select" class="menu-select">
            <option value="64">64 Participants</option>
            <option value="32">32 Participants</option>
            <option value="16">16 Participants</option>
        </select>
    </div>

    <div id="available-count">
        Chargement des informations de saison...
    </div>

    <br>
    <button onclick="initTournament()">LANCER LE JEU 🚀</button>
</div>

<script>
    // --- CONFIGURATION DES CHEMINS DES PRÉSETS ---
    const presetSeasons = [
        { id: "summer_2026_mix", name: "Été 2026", path: "data/summer-2026-mix.json" },
        { id: "automne_2019", name: "Automne 2019", path: "data/automne_2019.json" },
        { id: "summer_2019", name: "Été 2019", path: "data/summer_2019.json" },
        { id: "winter_2020", name: "Hiver 2020", path: "data/winter_2020.json" },
        { id: "winter_2022", name: "Hiver 2022", path: "data/winter_2022.json" },
        { id: "fall_2023", name: "Automne 2023", path: "data/fall_2023.json" },
        { id: "male_vs_female1", name: "male vs female singer 1", path: "data/male_vs_female1.json" },
        { id: "underrated_ed", name: "Underrated ED", path: "data/underrated ED.json" }
    ];

    let selectedSeasonData = null;

    function initMenu() {
        const select = document.getElementById('season-select');
        select.innerHTML = '';

        presetSeasons.forEach(season => {
            const opt = document.createElement('option');
            opt.value = season.id;
            opt.innerText = season.name;
            select.appendChild(opt);
        });

        const customOpt = document.createElement('option');
        customOpt.value = "custom";
        customOpt.innerText = "Uploader votre fichier JSON de saison (.json)";
        select.appendChild(customOpt);

        onSeasonChange();
    }

    function normalizeEntry(entry, index) {
        let title = entry.title || entry.name || entry.song || entry.label || `Entrée ${index + 1}`;
        const yt = entry.yt || entry.youtube || entry.youtubeId || entry.videoId || entry.id || entry.url || "";
        const at = entry.at || ""; 
        const thumb = entry.thumb || ""; 
        
        // NOUVEAU : On récupère le genre (male/female) depuis le JSON
        const vocal = (entry.vocal || entry.gender || "").toLowerCase();

        const rawType = entry.type || entry.category || entry.kind || "";
        const titleText = `${title} ${rawType}`.toUpperCase();

        let type = "OP";
        if (rawType === "ED" || rawType === "ending" || rawType === "Ending" || titleText.includes("(ED)") || titleText.includes("ENDING")) {
            type = "ED";
        } else if (rawType === "MIX" || rawType === "mix") {
            type = "MIX";
        }

        if (type === "OP" && !title.toUpperCase().includes("(OP)")) {
            title = `${title} (OP)`;
        } else if (type === "ED" && !title.toUpperCase().includes("(ED)")) {
            title = `${title} (ED)`;
        }

        return { title, yt, at, thumb, type, vocal, starred: false, result: "" };
    }

    function normalizeSeasonData(raw, fallbackName) {
        if (Array.isArray(raw)) return { seasonName: fallbackName || "Saison importée", entries: raw };
        if (raw && typeof raw === "object") {
            const possibleArrays = [raw.entries, raw.items, raw.data, raw.tracks, raw.songs, raw.musics].filter(Array.isArray);
            const source = possibleArrays[0] || [];
            return { seasonName: raw.seasonName || raw.name || raw.title || fallbackName || "Saison importée", entries: source };
        }
        return { seasonName: fallbackName || "Saison importée", entries: [] };
    }

    function parseEntries(entries) {
        if (!Array.isArray(entries)) return [];
        return entries.map((entry, index) => normalizeEntry(entry, index));
    }

    function getSelectedEntries() {
        if (selectedSeasonData && Array.isArray(selectedSeasonData.entries)) {
            return parseEntries(selectedSeasonData.entries);
        }
        return [];
    }

    function updateCountLabel() {
        const parsed = getSelectedEntries();
        const total = parsed.length;
        const ops = parsed.filter(e => e.type === "OP").length;
        const eds = parsed.filter(e => e.type === "ED").length;
        
        // Affiche le nombre d'hommes et de femmes trouvés dans le JSON
        const males = parsed.filter(e => e.vocal === "male" || e.vocal === "m").length;
        const females = parsed.filter(e => e.vocal === "female" || e.vocal === "f").length;

        const name = selectedSeasonData ? selectedSeasonData.seasonName : "Aucune saison";

        document.getElementById('available-count').innerText =
            `Saison chargée : ${name}\n` +
            `Total : ${total} morceaux  |  OP : ${ops}  |  ED : ${eds}\n` +
            `Tags trouvés : ${males} Hommes  |  ${females} Femmes`;
    }

    async function loadPresetSeason(id) {
        const season = presetSeasons.find(s => s.id === id);
        if (!season) return;

        try {
            const response = await fetch(season.path);
            if (!response.ok) throw new Error("HTTP " + response.status);
            const data = await response.json();
            selectedSeasonData = normalizeSeasonData(data, season.name);
            updateCountLabel();
        } catch (error) {
            console.error("Erreur de chargement fetch :", error);
            selectedSeasonData = null;
            document.getElementById('available-count').innerText = 
                `⚠️ Impossible de charger "${season.name}" automatiquement.\n👉 Veuillez choisir l'option "Uploader votre fichier JSON"`;
        }
    }

    async function onSeasonChange() {
        const select = document.getElementById('season-select');
        const uploadGroup = document.getElementById('json-upload-group');
        
        if (select.value === "custom") {
            uploadGroup.style.display = "block";
            selectedSeasonData = null;
            document.getElementById('available-count').innerText = "Veuillez uploader un fichier JSON.";
        } else {
            uploadGroup.style.display = "none";
            await loadPresetSeason(select.value);
        }
    }

    function loadCustomJson(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = JSON.parse(e.target.result);
                selectedSeasonData = normalizeSeasonData(data, file.name.replace(/\.json$/i, ""));
                alert(`Saison "${selectedSeasonData.seasonName}" chargée avec succès !`);
                updateCountLabel();
            } catch (err) {
                alert("Erreur lors de la lecture du fichier JSON : " + err.message);
                event.target.value = "";
            }
        };
        reader.readAsText(file);
    }

    function initTournament() {
        if (!selectedSeasonData || !Array.isArray(selectedSeasonData.entries) || selectedSeasonData.entries.length === 0) {
            alert("Veuillez d'abord charger un fichier de saison valide.");
            return;
        }

        const category = document.querySelector('input[name="category"]:checked').value;
        const gameMode = document.querySelector('input[name="gamemode"]:checked').value;
        let parsed = getSelectedEntries();

        if (category === "OP") parsed = parsed.filter(e => e.type === "OP");
        else if (category === "ED") parsed = parsed.filter(e => e.type === "ED");

        let selectedSize = parseInt(document.getElementById('tournament-size-select').value);
        let finalEntries = [];

        // NOUVEAU : Logique spécifique si le mode "Hommes vs Femmes" est sélectionné
        if (gameMode === "GENDER") {
            const males = parsed.filter(e => e.vocal === "male" || e.vocal === "m");
            const females = parsed.filter(e => e.vocal === "female" || e.vocal === "f");

            let halfSize = selectedSize / 2;

            if (males.length < halfSize || females.length < halfSize) {
                const maxHalf = Math.min(males.length, females.length);
                const powers = [32, 16, 8, 4, 2, 1];
                halfSize = powers.find(p => p <= maxHalf);

                if (!halfSize || halfSize === 0) {
                    alert(`Impossible de lancer ce mode : il n'y a pas assez de musiques taguées "vocal": "male" ou "female" ! (Hommes: ${males.length}, Femmes: ${females.length})`);
                    return;
                }
                selectedSize = halfSize * 2;
                alert(`Données insuffisantes. Ajustement automatique : Le jeu passe à ${selectedSize} participants (${halfSize} H vs ${halfSize} F).`);
            }

            males.sort(() => Math.random() - 0.5);
            females.sort(() => Math.random() - 0.5);

            // On entrelace les hommes et les femmes (1 homme, 1 femme, 1 homme, 1 femme...)
            for (let i = 0; i < halfSize; i++) {
                if (Math.random() > 0.5) finalEntries.push(males[i], females[i]);
                else finalEntries.push(females[i], males[i]);
            }

        } else {
            // Mode Tournoi Standard
            if (parsed.length === 0) {
                alert("Aucun morceau ne correspond aux critères choisis dans cette saison !");
                return;
            }

            parsed.sort(() => Math.random() - 0.5);

            if (parsed.length < selectedSize) {
                const powers = [64, 32, 16, 8, 4, 2];
                selectedSize = powers.find(p => p <= parsed.length) || 2;
                alert(`Données insuffisantes. Le tournoi est automatiquement ajusté à ${selectedSize} participants.`);
            }

            finalEntries = parsed.slice(0, selectedSize);
        }

        finalEntries.forEach(entry => {
            entry.starred = false;
            entry.result = `Top ${selectedSize}`;
        });

        // Envoi au Storage
        localStorage.removeItem('tournamentParticipants');
        localStorage.removeItem('tournamentSize');
        localStorage.removeItem('matchHistory');
        localStorage.removeItem('historyStateStack');
        localStorage.removeItem('finalResults');

        localStorage.setItem('tournamentParticipants', JSON.stringify(finalEntries));
        localStorage.setItem('gameMode', gameMode);

        // NOUVEAU : Redirection vers la bonne arène de jeu selon le mode
        if (gameMode === "GENDER") {
            window.location.href = 'gender_match.html';
        } else {
            window.location.href = 'tournament.html';
        }
    }

    initMenu();
</script>
</body>
</html>
