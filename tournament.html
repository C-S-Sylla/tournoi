<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tournoi Anime OP/ED - Matchs en Cours</title>

    <!-- PRECONNECT ANISONGDB / AMQ / CATBOX (0 latence SSL) -->
    <link rel="dns-prefetch" href="https://naedist.animemusicquiz.com">
    <link rel="preconnect" href="https://naedist.animemusicquiz.com" crossorigin>
    <link rel="dns-prefetch" href="https://files.catbox.moe">
    <link rel="preconnect" href="https://files.catbox.moe" crossorigin>

    <style>
        :root { 
            --primary: #6366f1; 
            --bg: #0f172a; 
            --card-bg: #1e293b; 
            --text: #f8fafc; 
        }
        body { 
            font-family: sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            margin: 0; 
            text-align: center; 
        }
        .header { 
            padding: 20px; 
            background: #1e293b; 
            margin-bottom: 20px; 
            position: relative;
        }
        .container { 
            display: flex; 
            justify-content: center; 
            gap: 20px; 
            padding: 20px; 
            flex-wrap: wrap; 
        }
        
        .match-card { 
            background: var(--card-bg); 
            border-radius: 15px; 
            padding: 15px; 
            width: 100%; 
            max-width: 450px; 
            box-sizing: border-box;
            border: 3px solid transparent; 
            transition: 0.3s; 
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .match-card:hover { 
            border-color: var(--primary); 
        }
        .video-box { 
            width: 100%; 
            aspect-ratio: 16/9; 
            background: #000; 
            border-radius: 10px; 
            overflow: hidden; 
            margin-bottom: 10px; 
        }
        iframe, video { 
            width: 100%; 
            height: 100%; 
            border: none; 
            object-fit: cover;
        }
        button { 
            background: var(--primary); 
            color: white; 
            border: none; 
            padding: 15px 30px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 1.2rem; 
            font-weight: bold; 
            width: 100%; 
            transition: 0.2s;
        }
        button:hover {
            opacity: 0.9;
        }
        .vs { 
            font-size: 3rem; 
            align-self: center; 
            color: #ef4444; 
            font-weight: bold; 
        }
        .hidden { 
            display: none !important; 
        }

        .star-btn { 
            background: #475569; 
            color: #e2e8f0; 
            border: none; 
            padding: 8px 15px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 1rem; 
            font-weight: bold; 
            margin-bottom: 12px; 
            width: 100%; 
            transition: 0.2s;
        }
        .star-btn:hover { background: #64748b; }
        .star-btn.starred { background: #eab308; color: #0f172a; }
        
        .yt-link {
            display: inline-block;
            color: #38bdf8;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: bold;
            background: rgba(56, 189, 248, 0.15);
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid rgba(56, 189, 248, 0.3);
            transition: 0.2s;
        }
        .yt-link:hover {
            background: rgba(56, 189, 248, 0.25);
            border-color: #38bdf8;
        }

        .switch-btn {
            background: #1e293b;
            border: 1px solid #475569;
            color: #94a3b8;
            padding: 5px 10px;
            font-size: 0.8rem;
            border-radius: 5px;
            cursor: pointer;
            width: auto;
            transition: 0.2s;
            margin-top: 5px;
        }
        .switch-btn:hover {
            background: #334155;
            color: #f8fafc;
            border-color: #64748b;
        }

        .undo-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            margin: 10px auto;
            transition: 0.2s;
            display: none;
        }
        .undo-btn:hover {
            background: #dc2626;
        }

        @media (max-width: 768px) {
            .header { padding: 15px 10px; }
            .header h1 { font-size: 1.5rem; margin-top: 0; }
            .container { padding: 10px; gap: 10px; }
            .vs { font-size: 2rem; width: 100%; margin: 5px 0; }
            button { padding: 12px; font-size: 1.1rem; }
            .match-card h3 { font-size: 1.1rem; margin: 10px 0; }
        }
    </style>
    <link rel="icon" type="image/png" href="favicon.png">

</head>
<body>

<!-- Lecteur silencieux de préchargement -->
<video id="preloader-1" preload="auto" style="display:none;"></video>

<!-- EN-TÊTE DU TOURNOI -->
<div class="header">
    <h1 id="round-name" style="color: #38bdf8;">Chargement...</h1>
    <p id="match-info" style="color: #94a3b8; font-weight: bold;">Match 1 / 32</p>
</div>

<!-- L'ARÈNE DE COMBAT -->
<div id="tournament-screen">
    <div class="container" id="tournament-area">
        <div class="match-card">
            <div class="video-box" id="player1"></div>
            <h3 id="title1">Anime A</h3>
            <button id="star-0" class="star-btn" onclick="toggleStar(0)">☆ Marquer ?</button>
            <button onclick="vote(0)">CHOISIR</button>
        </div>

        <div class="vs">VS</div>

        <div class="match-card">
            <div class="video-box" id="player2"></div>
            <h3 id="title2">Anime B</h3>
            <button id="star-1" class="star-btn" onclick="toggleStar(1)">☆ Marquer ?</button>
            <button onclick="vote(1)">CHOISIR</button>
        </div>
    </div>
    <button id="undo-btn" class="undo-btn" onclick="undo()">↩ Revenir en arrière</button>
</div>

<script>
    let currentRound = [];
    let initialShuffled = [];
    let nextRound = [];
    let currentIndex = 0;
    const matchHistory = [];
    const historyStateStack = [];

    // --- 1. DÉMARRAGE ET PRÉCHARGEMENT ---
    window.onload = () => {
        const storedParticipants = localStorage.getItem('tournamentParticipants');
        if (!storedParticipants) {
            alert("Aucune donnée de tournoi trouvée. Redirection vers le menu...");
            window.location.href = 'index.html';
            return;
        }

        initialShuffled = JSON.parse(storedParticipants);
        currentRound = initialShuffled.map(e => ({ ...e }));

        updateDisplay();
        startBackgroundPreloadAll();
    };

    // PRÉCHARGEMENT 100% BLOB IDENTIQUE À ANNEE_VS_ANNEE
    // PRÉCHARGEMENT 100% BLOB EN TÂCHE DE FOND + CONSERVATION ROUND SUIVANT
    async function startBackgroundPreloadAll() {
        console.log("🚀 [AnisongDB] Téléchargement 100% Blob de tout le tableau...");

        for (let i = 0; i < currentRound.length; i++) {
            const item = currentRound[i];
            const videoUrl = item.as || item.at || item.link || item.url || item.resolvedUrl;

            // Télécharge uniquement si ce n'est pas DÉJÀ en cache Blob (Conservé entre les rounds !)
            if (videoUrl && typeof videoUrl === 'string' && videoUrl.trim() !== "" && !item.blobUrl && !item.isDownloading) {
                item.isDownloading = true;

                try {
                    const cleanUrl = videoUrl.trim();
                    console.log(`📥 [Aspiration 100%] Téléchargement de : ${item.title}`);
                    
                    const response = await fetch(cleanUrl);
                    const blob = await response.blob();

                    // Sauvegarde dans l'objet (Persiste pendant tout le tournoi !)
                    item.blobUrl = URL.createObjectURL(blob);
                    item.isDownloaded = true;
                    console.log(`✅ [Barre 100% Pleine en RAM !] : ${item.title}`);

                    // TRANSFETS EN DIRECT : Si la vidéo est actuellement jouée à l'écran, on bascule la barre à 100% !
                    refreshActiveVideoPlayersIfBlobReady();
                } catch (e) {
                    console.warn(`Passage en flux direct pour ${item.title}`, e);
                } finally {
                    item.isDownloading = false;
                }
            }
        }
    }

    // TRANSFERT EN DIRECT (Hot-Swap) : Met la barre à 100% sans couper la musique
    function refreshActiveVideoPlayersIfBlobReady() {
        const checkAndSwap = (item, playerContainerId) => {
            if (!item || !item.blobUrl) return;
            const container = document.getElementById(playerContainerId);
            if (!container) return;

            const video = container.querySelector('video');
            // Si la vidéo tourne sur l'URL directe (pas encore en Blob)
            if (video && !video.src.startsWith('blob:')) {
                const currentTime = video.currentTime; // Retient la seconde exacte
                const isPaused = video.paused;

                // Bascule sur la version 100% locale
                video.src = item.blobUrl;
                video.currentTime = currentTime; // Reprend à la même seconde
                if (!isPaused) {
                    video.play().catch(() => {});
                }
                console.log(`⚡ [Hot-Swap 100%] Barre de chargement passée à 100% en direct pour : ${item.title}`);
            }
        };

        if (currentRound[currentIndex]) checkAndSwap(currentRound[currentIndex], 'player1');
        if (currentRound[currentIndex + 1]) checkAndSwap(currentRound[currentIndex + 1], 'player2');
    }

    // --- 2. AFFICHAGE ET LECTEURS ---
    function updateDisplay() {
        if (currentRound.length === 1) {
            showWinner(currentRound[0]);
            return;
        }

        const undoBtn = document.getElementById('undo-btn');
        if (undoBtn) {
            undoBtn.style.display = historyStateStack.length > 0 ? 'inline-block' : 'none';
        }

        document.getElementById('round-name').innerText = getRoundTitle(currentRound.length);
        document.getElementById('match-info').innerText = `Match ${(currentIndex/2)+1} / ${currentRound.length/2}`;

        const choice1 = currentRound[currentIndex];
        const choice2 = currentRound[currentIndex + 1];

        document.getElementById('title1').innerText = choice1.title;
        document.getElementById('title2').innerText = choice2.title;

        updateStarButtonState(0, choice1.starred);
        updateStarButtonState(1, choice2.starred);

        document.getElementById('player1').innerHTML = getPlayerHTML(choice1, 0);
        document.getElementById('player2').innerHTML = getPlayerHTML(choice2, 1);
    }

    // LECTEUR HTML IDENTIQUE À ANNEE_VS_ANNEE
    function getPlayerHTML(choice, index) {
        if (!choice) return `<div style="color:#ef4444; padding:20px;">⚠️ Élément vide</div>`;

        // 1. Utilise l'URL Blob (100% remplie) si disponible, sinon le lien direct (as, at, link)
        const videoSource = choice.blobUrl || choice.as || choice.at || choice.link || choice.url || choice.webm || choice.resolvedUrl;

        if (videoSource && typeof videoSource === 'string' && videoSource.trim() !== "") {
            return `<video src="${videoSource.trim()}" controls preload="auto" style="width:100%; height:100%; object-fit:cover; border-radius:10px; background:#000;"></video>`;
        }
        
        // 2. Si c'est un lien YouTube
        const ytId = choice.yt || choice.youtube || choice.youtubeId;

        if (ytId && typeof ytId === 'string' && ytId.trim() !== "") {
            return `
                <iframe src="https://www.youtube.com/embed/${ytId.trim()}?rel=0" allowfullscreen></iframe>
                <div style="margin-top: 8px;">
                    <button class="switch-btn" onclick="switchPlayer(${index}, '${ytId.trim()}')">Lecteur alternatif si bloqué 🔁</button>
                </div>
            `;
        }

        return `
            <div style="height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#ef4444; background:#000; padding:10px; text-align:center;">
                <span style="font-weight:bold; font-size:0.9rem;">⚠️ Lien manquant dans le JSON</span>
            </div>
        `;
    }

    function switchPlayer(index, ytId) {
        const iframe = document.querySelector(`#player${index + 1} iframe`);
        if (!iframe) return;
        if (iframe.src.includes('youtube.com')) {
            iframe.src = `https://yewtu.be/embed/${ytId}`;
        } else {
            iframe.src = `https://www.youtube.com/embed/${ytId}?rel=0`;
        }
    }

    // --- 3. BOUTONS ET LOGIQUE DE TOURNOI ---
    function toggleStar(indexOffset) {
        const entry = currentRound[currentIndex + indexOffset];
        entry.starred = !entry.starred;
        
        const initialEntry = initialShuffled.find(e => (e.yt && e.yt === entry.yt) || (e.as && e.as === entry.as) || (e.at && e.at === entry.at));
        if (initialEntry) {
            initialEntry.starred = entry.starred;
        }

        updateStarButtonState(indexOffset, entry.starred);
    }

    function updateStarButtonState(indexOffset, isStarred) {
        const btn = document.getElementById(`star-${indexOffset}`);
        if (!btn) return;
        if (isStarred) {
            btn.classList.add('starred');
            btn.innerText = "⭐ Marqué !";
        } else {
            btn.classList.remove('starred');
            btn.innerText = "☆ Marquer ?";
        }
    }

    function saveState() {
        historyStateStack.push({
            currentRound: currentRound.map(e => ({ ...e })),
            nextRound: nextRound.map(e => ({ ...e })),
            currentIndex: currentIndex,
            matchHistory: matchHistory.map(m => ({
                roundSize: m.roundSize,
                p1: { ...m.p1 },
                p2: { ...m.p2 },
                winnerTitle: m.winnerTitle
            })),
            initialShuffledState: initialShuffled.map(e => ({ yt: e.yt, as: e.as, at: e.at, starred: e.starred, result: e.result }))
        });
    }

    function undo() {
        if (historyStateStack.length === 0) return;

        const prevState = historyStateStack.pop();

        currentRound = prevState.currentRound;
        nextRound = prevState.nextRound;
        currentIndex = prevState.currentIndex;

        matchHistory.length = 0;
        matchHistory.push(...prevState.matchHistory);

        if (prevState.initialShuffledState) {
            prevState.initialShuffledState.forEach(state => {
                const target = initialShuffled.find(e => (e.yt && e.yt === state.yt) || (e.as && e.as === state.as) || (e.at && e.at === state.at));
                if (target) {
                    target.starred = state.starred;
                    target.result = state.result;
                }
            });
        }

        updateDisplay();
    }

    function vote(indexOffset) {
        saveState();

        const p1 = currentRound[currentIndex];
        const p2 = currentRound[currentIndex + 1];

        const winner = indexOffset === 0 ? p1 : p2;
        const loser = indexOffset === 0 ? p2 : p1;

        // AJOUT DES IDENTIFIANTS UNIQUES DU GAGNANT DANS L'HISTORIQUE :
        matchHistory.push({
            roundSize: currentRound.length,
            p1: { ...p1 },
            p2: { ...p2 },
            winnerUid: winner.uid || "",
            winnerAs: winner.as || "",
            winnerYt: winner.yt || "",
            winnerTitle: winner.title
        });

        const stageName = getEliminationStageName(currentRound.length);
        loser.result = stageName;
        
        // Marque le perdant exact par son lien vidéo ou UID
        const initialLoser = initialShuffled.find(e => 
            (e.uid && loser.uid && e.uid === loser.uid) || 
            (e.as && loser.as && e.as === loser.as && e.as !== "") || 
            (e.yt && loser.yt && e.yt === loser.yt && e.yt !== "")
        );
        if (initialLoser) {
            initialLoser.result = stageName;
        }

        nextRound.push(winner);
        currentIndex += 2;

        if (currentIndex >= currentRound.length) {
            currentRound = [...nextRound];
            nextRound = [];
            currentIndex = 0;
        }

        updateDisplay();
    }

    function getRoundTitle(n) {
        if (n === 64) return "32èmes de Finale";
        if (n === 32) return "16èmes de Finale";
        if (n === 16) return "8èmes de Finale";
        if (n === 8) return "Quarts de Finale";
        if (n === 4) return "Demi-Finales";
        if (n === 2) return "GRANDE FINALE";
        return `Tour de ${n}`;
    }

    function getEliminationStageName(n) {
        if (n === 64) return "Top 64 (32èmes)";
        if (n === 32) return "Top 32 (16èmes)";
        if (n === 16) return "Top 16 (8èmes)";
        if (n === 8) return "Top 8 (Quarts)";
        if (n === 4) return "Top 4 (Demi-Finales)";
        if (n === 2) return "Finaliste (2ème)";
        return "Éliminé";
    }

    function showWinner(winner) {
        winner.result = "🏆 CHAMPION 🏆";

        const initialWinner = initialShuffled.find(e => (e.yt && e.yt === winner.yt) || (e.as && e.as === winner.as) || (e.at && e.at === winner.at));
        if (initialWinner) {
            initialWinner.result = "🏆 CHAMPION 🏆";
        }

        document.getElementById('player1').innerHTML = "";
        document.getElementById('player2').innerHTML = "";

        localStorage.setItem('finalResults', JSON.stringify({
            winner: winner,
            matchHistory: matchHistory,
            initialShuffled: initialShuffled
        }));

        window.location.href = 'results.html';
    }
</script>
</body>
</html>
