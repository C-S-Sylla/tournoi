<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test AMQ - Vitesse Ultra Boostée + Hot-Swap</title>
    
    <!-- BOOSTER 1 : Preconnect au serveur AMQ (Négocie le SSL/DNS à l'avance) -->
    <link rel="dns-prefetch" href="https://naedist.animemusicquiz.com">
    <link rel="preconnect" href="https://naedist.animemusicquiz.com" crossorigin>
    <link rel="dns-prefetch" href="https://files.catbox.moe">
    <link rel="preconnect" href="https://files.catbox.moe" crossorigin>

    <style>
        :root { --primary: #6366f1; --bg: #0f172a; --card-bg: #1e293b; --text: #f8fafc; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; text-align: center; }
        .header { padding: 20px; background: #1e293b; margin-bottom: 20px; }
        .container { display: flex; justify-content: center; gap: 20px; padding: 20px; flex-wrap: wrap; }
        .match-card { background: var(--card-bg); border-radius: 15px; padding: 15px; width: 100%; max-width: 450px; box-sizing: border-box; }
        .video-box { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 10px; overflow: hidden; margin-bottom: 10px; position: relative; }
        
        /* Style des lecteurs recyclés */
        video, iframe { width: 100%; height: 100%; border: none; object-fit: cover; position: absolute; top:0; left:0; }
        button { background: var(--primary); color: white; border: none; padding: 15px; border-radius: 8px; cursor: pointer; font-size: 1.2rem; font-weight: bold; width: 100%; margin-top: 10px; }
        .vs { font-size: 3rem; align-self: center; color: #ef4444; font-weight: bold; }
        
        .badge { display: inline-block; padding: 5px 12px; border-radius: 6px; font-size: 0.85rem; font-weight: bold; margin-bottom: 10px; }
        .badge-amq { background: #10b981; color: white; }
        .badge-yt { background: #ef4444; color: white; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="header">
    <h1>🚀 Test AMQ - Vitesse Max + Hot-Swap 100%</h1>
    <p id="match-info" style="color: #38bdf8; font-weight: bold;">Duel 1 / 2</p>
</div>

<div class="container">
    <!-- CARTE GAUCHE -->
    <div class="match-card">
        <span id="badge1" class="badge">AMQ Direct</span>
        <div class="video-box">
            <video id="video-player-1" controls preload="auto"></video>
            <iframe id="yt-player-1" class="hidden" allowfullscreen></iframe>
        </div>
        <h3 id="title1">Chanson 1</h3>
        <button onclick="vote(0)">CHOISIR</button>
    </div>

    <div class="vs">VS</div>

    <!-- CARTE DROITE -->
    <div class="match-card">
        <span id="badge2" class="badge">AMQ Direct</span>
        <div class="video-box">
            <video id="video-player-2" controls preload="auto"></video>
            <iframe id="yt-player-2" class="hidden" allowfullscreen></iframe>
        </div>
        <h3 id="title2">Chanson 2</h3>
        <button onclick="vote(1)">CHOISIR</button>
    </div>
</div>

<script>
    // DONNÉES DE TEST AMQ + YOUTUBE
    const testList = [
        { title: "Test AMQ 1 (WebM Direct)", amq: "https://naedist.animemusicquiz.com/slwpxw.webm" },
        { title: "Test AMQ 2 (WebM Direct)", amq: "https://naedist.animemusicquiz.com/ldbm8e.webm" },
        { title: "Test YouTube (Solo Leveling)", yt: "u9H38O7-q_w" },
        { title: "Test AMQ 3 (WebM Direct)", amq: "https://naedist.animemusicquiz.com/zptefi.webm" }
    ];

    let currentIndex = 0;

    // 1. ASPIRATION 100% BLOB EN TÂCHE DE FOND
    async function startBackgroundPreloadAll() {
        console.log("🚀 [AMQ Blob] Démarrage de l'aspiration 100%...");

        for (let i = 0; i < testList.length; i++) {
            const item = testList[i];
            const videoUrl = item.amq || item.as || item.url;

            if (videoUrl && !item.blobUrl && !item.isDownloading) {
                item.isDownloading = true;

                try {
                    console.log(`📥 [Aspiration 100%] : ${item.title}`);
                    const response = await fetch(videoUrl);
                    const blob = await response.blob();

                    // Conversion en URL Blob locale
                    item.blobUrl = URL.createObjectURL(blob);
                    item.isDownloaded = true;
                    console.log(`✅ [Barre 100% Pleine !] : ${item.title}`);

                    // HOT-SWAP : Bascule en direct si le joueur regarde cette vidéo !
                    refreshActiveVideoPlayersIfBlobReady();
                } catch (e) {
                    console.warn(`Fallback direct pour ${item.title}`, e);
                } finally {
                    item.isDownloading = false;
                }
            }
        }
    }

    // 2. HOT-SWAP EN DIRECT (Bascule la barre à 100% sans couper la musique)
    function refreshActiveVideoPlayersIfBlobReady() {
        const checkAndSwap = (item, playerNum) => {
            if (!item || !item.blobUrl) return;
            const v = document.getElementById(`video-player-${playerNum}`);
            
            // Si la vidéo tourne actuellement sur l'URL directe (pas encore en Blob)
            if (v && !v.classList.contains('hidden') && !v.src.startsWith('blob:')) {
                const currentTime = v.currentTime; // Retient la seconde
                const isPaused = v.paused;

                v.src = item.blobUrl;
                v.currentTime = currentTime; // Reprend au même endroit
                if (!isPaused) {
                    v.play().catch(() => {});
                }
                console.log(`⚡ [Hot-Swap AMQ] Barre mise à 100% en direct pour Joueur ${playerNum} : ${item.title}`);
            }
        };

        if (testList[currentIndex]) checkAndSwap(testList[currentIndex], 1);
        if (testList[currentIndex + 1]) checkAndSwap(testList[currentIndex + 1], 2);
    }

    // 3. AFFICHAGE ET RECYCLAGE DU LECTEUR
    function updateDisplay() {
        if (currentIndex >= testList.length) {
            alert("🏆 Test terminé ! Rechargement du test...");
            currentIndex = 0;
        }

        document.getElementById('match-info').innerText = `Duel ${(currentIndex/2)+1} / ${testList.length/2}`;

        const c1 = testList[currentIndex];
        const c2 = testList[currentIndex + 1];

        document.getElementById('title1').innerText = c1.title;
        document.getElementById('title2').innerText = c2.title;

        // Mise à jour des badges
        document.getElementById('badge1').innerText = (c1.amq || c1.as) ? "AnisongDB Direct ⚡" : "YouTube 🔴";
        document.getElementById('badge1').className = "badge " + ((c1.amq || c1.as) ? "badge-amq" : "badge-yt");

        document.getElementById('badge2').innerText = (c2.amq || c2.as) ? "AnisongDB Direct ⚡" : "YouTube 🔴";
        document.getElementById('badge2').className = "badge " + ((c2.amq || c2.as) ? "badge-amq" : "badge-yt");

        // Configuration instantanée des lecteurs
        setupPlayer(1, c1);
        setupPlayer(2, c2);
    }

    function setupPlayer(playerNum, choice) {
        const v = document.getElementById(`video-player-${playerNum}`);
        const yt = document.getElementById(`yt-player-${playerNum}`);

        if (!choice) return;

        // Utilise le Blob (100% plein) en priorité si prêt
        const videoSource = choice.blobUrl || choice.amq || choice.as || choice.url;

        if (videoSource) {
            yt.classList.add('hidden');
            yt.src = "";
            v.classList.remove('hidden');

            if (v.src !== videoSource) {
                v.src = videoSource;
                v.load();
            }
        } else if (choice.yt) {
            v.classList.add('hidden');
            v.src = "";
            v.pause();
            yt.classList.remove('hidden');
            yt.src = `https://www.youtube.com/embed/${choice.yt}?rel=0`;
        }
    }

    function vote(idx) {
        currentIndex += 2;
        updateDisplay();
    }

    // Lancement au démarrage
    updateDisplay();
    startBackgroundPreloadAll();
</script>

</body>
</html>
